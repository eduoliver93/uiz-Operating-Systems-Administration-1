<script>
const T=[[["What is fundamentally an Operating System (OS)?", ["An office application for end-user productivity.", "The fundamental software layer that manages a computer's hardware and provides services to applications and users.", "An integrated circuit responsible exclusively for arithmetic processing.", "A network protocol used for communication between servers and clients."], 1], ["What would be the main consequence for the user if a computer had no Operating System?", ["The computer would work normally with a simplified interface.", "Users would have to interact directly with the hardware — a highly technical and impractical task.", "The device's battery would last much longer.", "Only cloud software would be able to run."], 1], ["What are the three central roles played by an Operating System?", ["Compiler, Interpreter, and Database Manager.", "Resource Manager, Control Program, and Convenience Provider.", "Firewall, Antivirus, and Encryptor.", "Graphical Interface, Wi-Fi Connection, and Video Driver."], 1], ["The OS role as \"Resource Manager\" is responsible for:", ["Translating high-level machine language code.", "Allocating CPU, memory, files, and I/O devices among competing programs, ensuring fair and efficient use.", "Creating visual interface designs for the end user.", "Managing exclusively the e-mail accounts connected to the system."], 1], ["How does the \"Control Program\" role act in an operating system?", ["By controlling the execution of user programs, preventing errors, improper use of hardware, and managing security.", "By automating the installation of game updates over the internet.", "By adjusting screen brightness according to ambient light.", "By syncing files between the computer and a smartphone."], 0], ["What does the \"Convenience Provider\" role provide to users and programmers?", ["Direct physical access to the motherboard transistors.", "Abstractions (such as files, processes, and sockets) so they don't have to manually manipulate raw hardware.", "Free antivirus software integrated at the factory.", "High-definition video editing tools."], 1], ["What are the 6 main functions described for an Operating System?", ["Web browsing, word processing, compression, decompression, firewall, and media playback.", "Audio processing, 3D rendering, compilation, debugging, version control, and backup.", "Process Management, Memory Management, File Management, I/O Management, Security/Protection, and User Interface.", "Packet routing, DNS translation, load balancing, SSL encryption, proxy, and NAT."], 2], ["In the context of Process Management, the OS is responsible for:", ["Creating, scheduling, and terminating processes, as well as managing CPU scheduling algorithms.", "Manufacturing the physical processing chips.", "Monitoring the physical temperature of the case fan.", "Deleting old temporary browser files."], 0], ["Which of the following describes a typical Memory Management task?", ["Managing access permissions to shared folders on the local network.", "Tracking which parts of memory are in use, handling paging/segmentation, and protecting one process's space from another.", "Controlling the print speed of a laser printer.", "Sending data packets through fiber optic cables."], 1], ["The main goal of File System Management is to:", ["Provide a logical storage abstraction over physical disks, organizing data, directories, and access permissions.", "Execute malicious code in an isolated environment (sandbox).", "Increase the clock speed of RAM memory.", "Replace the need for physical hard drives with quantum storage."], 0], ["What is the goal of Device and I/O Management?", ["Provide device drivers, manage I/O scheduling, buffering, caching, and spooling for standardized hardware access.", "Create realistic 3D graphics for next-generation games.", "Manage user passwords using end-to-end encryption.", "Automatically shut down the computer after 8 hours of inactivity."], 0], ["What does the Security and Protection function aim to guarantee in an OS?", ["Only the download speed of large files from the internet.", "The integrity, confidentiality, and reliability of the system through authentication, authorization, and process isolation.", "Compatibility with old optical media such as CDs and DVDs.", "Correct color display on high-fidelity monitors."], 1], ["What are the two main types of User Interface supported by an OS?", ["Command-Line Interface (CLI) and Graphical User Interface (GUI).", "Virtual Reality (VR) Interface and Augmented Reality (AR) Interface.", "Sound-Based Interface and Radar Tactile Gesture-Based Interface.", "Wireless Network Interface and High-Speed Serial Interface."], 0], ["What characterizes the Monolithic Architecture of an Operating System?", ["The kernel is divided into small independent modules that run in user space.", "The entire OS operates in kernel space as a single large process (e.g., classic Linux).", "Each application has its own embedded mini-operating system.", "The hardware directly controls the software without kernel intervention."], 1], ["How does the Layered Architecture organize the Operating System?", ["In a distributed cloud format without a fixed hierarchy.", "By dividing the OS into layers, where each layer provides services strictly to the layer immediately above it.", "By placing all hardware drivers at the top of the application stack.", "By executing all tasks in parallel without privilege distinction."], 1], ["What is the main characteristic of the Microkernel Architecture?", ["Keeping the kernel as large and complete as possible to guarantee maximum speed.", "Keeping the kernel minimal, running only essential services (such as IPC and scheduling), with other services running in user space.", "Completely removing the need for memory management.", "Working exclusively on low-power mobile devices."], 1], ["What defines the Hybrid Architecture of an Operating System?", ["The simultaneous use of two CPUs from different manufacturers.", "The combination of characteristics from monolithic and microkernel designs, mixing high performance with modularity (e.g., modern Windows and macOS).", "The automatic alternation between 32-bit and 64-bit operating systems.", "The exclusive execution of software emulated via virtual hardware."], 1], ["What is the correct order of components in the system stack in a standard layered model (from top to bottom)?", ["Hardware → Kernel → APIs → Applications → User", "User → Applications → Libraries/APIs → OS Kernel → Hardware", "Applications → Hardware → User → Kernel → APIs", "Kernel → Hardware → User → Applications → APIs"], 1], ["What is the main function of System Libraries and APIs in the system stack?", ["Provide high-level interfaces (such as libc or Win32 API) so applications can access OS services without coding direct system calls.", "Replace the main processor in floating-point tasks.", "Physically connect the computer to the local network via Ethernet cable.", "Permanently store data in the cloud without user intervention."], 0], ["What is the main privilege difference between Kernel Space and User Space?", ["Kernel Space runs in privileged mode managing critical hardware/resources, while User Space executes applications and libraries with access restrictions.", "User Space has full access to hardware, while Kernel Space is restricted to aesthetic tasks.", "There is no privilege difference; both share the same security level.", "Kernel Space only works when the computer is disconnected from the network."], 0], ["How is modern Linux structurally classified in terms of kernel architecture?", ["Pure microkernel.", "Monolithic with support for loadable modules (modular).", "Entirely cloud-based without a local kernel.", "Rigid layered architecture without support for external drivers."], 1], ["What type of kernel architecture does the Windows operating system (NT/10/11) predominantly use?", ["Hybrid Architecture (monolithic core, modular components, and the HAL).", "Strict microkernel without kernel-mode drivers.", "Batch-based operating system from the 1960s.", "Distributed architecture based on peer-to-peer nodes."], 0], ["How does macOS/iOS (XNU) structure its operating system architecture?", ["It uses the MS-DOS kernel extended with graphical interfaces.", "It is purely microkernel-based without graphical support layers.", "It is hybrid, combining the Mach microkernel, BSD components, and the I/O Kit.", "It runs entirely inside Java virtual machines."], 2], ["Why is it important for a Computer Science student to study the history of Operating Systems?", ["To memorize exact release dates of old commercial software.", "To understand why modern designs exist, how they were shaped by hardware limitations, and to understand current trade-offs.", "To learn to program in assembly language for 1940s computers.", "To replace the study of data structures and advanced algorithms."], 1], ["How did first-generation computers (1940s–1950s, e.g., ENIAC, UNIVAC) work regarding software?", ["They had advanced graphical operating systems with mouse support.", "They had no operating system; programs were entered manually using switches and plugboards, running one job at a time.", "They executed multiple processes in the cloud through primitive wireless networks.", "They used high-capacity hard drives with hierarchical file systems."], 1], ["What was the main operational bottleneck of first-generation computers without an Operating System?", ["Incompatibility with high-definition color monitors.", "Highly inefficient use of hardware, characterized by extensive periods of idle time.", "Slow data transmission via transoceanic fiber optics.", "The high cost of proprietary software licenses."], 1], ["What characterized Batch Processing Systems in the 1950s–1960s?", ["The use of punch cards and magnetic tape to group jobs executed sequentially by resident monitors, without interactivity.", "The ability for multiple users to chat in real time through video terminals connected to the internet.", "Instant execution of graphical touch-screen commands.", "Automatic ZIP file compression on mainframe computers."], 0], ["What was Multiprogramming, introduced in the 1960s–1970s?", ["A method to run multiple programs on separate computers connected by coaxial cables.", "The ability to keep multiple jobs in memory at once; when one waited for I/O, the CPU executed another to optimize usage.", "Programming computers using multiple high-level languages simultaneously.", "A version control system for developer teams on mainframes."], 1], ["What was the great innovation brought by Time-Sharing Systems (TSS)?", ["Enabling secure communication between banks through quantum cryptography.", "Introducing user interactivity by dividing CPU time into small time slices shared by multiple terminals simultaneously.", "Reducing mainframe electricity consumption by up to 90%.", "Eliminating the need for RAM through infinite magnetic disks."], 1], ["What was the historical importance of the Unix operating system (developed in the 1970s at Bell Labs)?", ["It was the first commercial operating system aimed exclusively at portable video game consoles.", "It was a portable, multiuser, and multitasking system that influenced almost all modern OS designs.", "It introduced the first fully touch-sensitive graphical interface in computing history.", "It created the first wireless internet protocol based on radio waves."], 1], ["What drove the emergence of the Personal Computing Era (1970s–1980s)?", ["The cheapening of hardware with the rise of microcomputers, shifting focus from mainframes to individual access (e.g., CP/M, MS-DOS).", "Government prohibition of large corporate computers.", "The invention of solid-state drive (SSD) technology.", "The creation of the first global text-based social networks."], 0], ["What was the impact of introducing Graphical User Interfaces (GUIs) in the 1980s–1990s?", ["They made computing exclusive to systems engineers specialized in command lines.", "They dramatically increased usability and accessibility, commercially popularized by the Apple Macintosh (1984) and Microsoft Windows (1985).", "They completely replaced the use of processors in modern motherboards.", "They prevented the advancement of storage capacity on magnetic disks."], 1], ["What are the main trends and characteristics of the Mobile, Distributed, and Cloud Era (2000s–Present)?", ["Exclusive use of desktop computers without internet connection.", "Focus on battery and sensor optimization (Android/iOS), large-scale virtualization, containerization, and cross-platform support.", "Return to batch systems based on paper punch cards.", "Total elimination of operating systems in favor of autonomous hardware."], 1], ["What defines a Batch Operating System (Batch OS) and what is its classic use case?", ["Jobs collected and executed sequentially without interactivity; used in large data processing (payroll, scientific calculations).", "Interactive 3D games running on next-generation smartphones.", "Air traffic control systems in absolute real time.", "High-availability web servers responding to millions of requests per second."], 0], ["What is the main operational characteristic of a Time-Sharing System?", ["Executing only one task per day at strictly scheduled times.", "Rapid alternation of processes in small time slices, giving multiple users the illusion of simultaneous use.", "Blocking other users' access while a single heavy process is running.", "Storing all user data on analog magnetic tapes."], 1], ["What differentiates Real-Time Operating Systems (RTOS) from general operating systems?", ["They are designed to process data and respond strictly within rigid time limits (deadlines).", "They run slower to save battery on mobile devices.", "They require no processor or RAM memory to function.", "They are used exclusively for editing high-resolution images and videos."], 0], ["What is the fundamental difference between Hard Real-Time and Soft Real-Time systems?", ["Hard Real-Time uses touch screens, while Soft Real-Time uses only mechanical keyboards.", "In Hard Real-Time, missing a deadline can be catastrophic (e.g., flight control); in Soft Real-Time, occasional deadline misses are acceptable (e.g., video streaming).", "Hard Real-Time runs only on personal computers, and Soft Real-Time only on mainframes.", "There is no technical difference; the terms are synonyms in the industry."], 1], ["What characterizes a Distributed Operating System?", ["An OS that manages a collection of independent computers making them appear as a single coherent system, with transparency in resource sharing.", "An antivirus that distributes security updates to corporate computers via pen drive.", "An operating system installed on computers that have no network card.", "Software that splits text files into smaller parts to fit on floppy disks."], 0], ["What is the main focus of a Network Operating System (NOS)?", ["Connecting and managing computers on a local area network (LAN), focusing on file sharing, printers, and communication (e.g., Windows Server).", "Creating interactive three-dimensional graphics for virtual reality.", "Replacing the need for internet protocols like TCP/IP.", "Exclusively managing lithium battery power consumption in electric vehicles."], 0], ["What characteristics do Mobile Operating Systems (Mobile OS) prioritize?", ["Command-line interfaces based on punch cards.", "Touch-based interfaces, energy efficiency (battery), strict security, and integrated support for mobility and sensors.", "Exclusive connection to 21-inch cathode ray tube monitors.", "Exclusive processing of quantum artificial intelligence algorithms."], 1], ["What are the central properties of an Embedded Operating System?", ["Minimal memory footprint, high reliability, often real-time, optimized for specific and limited hardware (e.g., routers, home appliances).", "Heavy graphical interfaces with highly complex 3D animations.", "Requiring daily manual updates performed by specialized engineers.", "Working exclusively on nuclear research supercomputers."], 0], ["What is the function of a Type 1 Hypervisor (Bare-Metal) in virtualized systems?", ["Running as a common application inside a desktop operating system like Windows.", "Installing directly on physical hardware to create and host multiple virtual machines (VMs) with their own operating systems (e.g., VMware ESXi).", "Converting digital audio files into old analog formats.", "Protecting local networks against denial-of-service cyberattacks."], 1], ["How does a Type 2 Hypervisor (Hosted) differ from a Type 1 Hypervisor?", ["Type 2 Hypervisor runs as an application on top of an existing host Operating System (e.g., VirtualBox, VMware Workstation).", "Type 2 Hypervisor is installed directly on the metal with no operating system underneath.", "Type 2 only works on computers manufactured before the year 2000.", "Type 2 does not allow creating virtual machines with Linux."], 0], ["What is the general recommendation for free disk space and RAM to set up OS labs with hypervisors and VMs?", ["2 GB of disk space and 512 MB of RAM.", "About 40 GB of free disk space and a recommended minimum of 16 GB of RAM.", "500 MB of disk space and 2 GB of RAM.", "1 Terabyte of disk space and 128 GB of RAM."], 1], ["What is the fundamental conceptual difference between a physical machine and a virtual machine managed by a hypervisor?", ["A physical machine has a single OS installed directly on the hardware, while the hypervisor allows hosting multiple operating systems concurrently.", "A virtual machine does not use a physical processor under any circumstances.", "A physical machine is always slower than any virtual machine in any scenario.", "Virtual machines do not need files or file systems to store data."], 0], ["What is the purpose of VMware Workstation Pro or VMware Fusion software in the context of the course labs?", ["To browse the internet anonymously using VPN networks.", "To function as Type 2 hypervisors, creating, managing, and hosting virtual machines on the student's laptop.", "To compile C++ code directly for Arduino microcontrollers.", "To edit high-definition educational videos for Moodle."], 1], ["What are the general steps to download VMware virtualization software through the Broadcom platform?", ["Buy a physical license at a local electronics store.", "Register a Broadcom account, log in, access the free downloads panel (My Downloads), and select the appropriate version (Fusion for macOS or Workstation Pro for Windows).", "Send an email to technical support requesting a floppy disk installation.", "Download directly from random links on internet forums without registration."], 1], ["Which version of the Ubuntu Desktop operating system is recommended for installation on Windows laptops in OS lab environments?", ["Discontinued Ubuntu 10.04 LTS.", "The Long-Term Support (LTS) version, specifically Ubuntu 24.04.3 LTS.", "An unstable alpha version released yesterday on the internet.", "Only server-exclusive versions without a graphical interface."], 1], ["Why is it crucial to check the CPU architecture (Intel vs. ARM/Apple Silicon) when downloading an Ubuntu image for Apple macOS computers?", ["Because the processor architecture dictates binary compatibility; Intel processors require the Intel installer, while Apple Silicon chips (M3, M4) require the ARM version.", "Because Apple computers with ARM chips do not run virtual machines.", "Because Intel processors only work with old Windows systems.", "To ensure the graphical interface color is correct on the Retina display."], 0], ["What is the main operational difference between a Virtual Machine (VM) and a Container (such as Docker) in the context of modern operating systems?", ["A Virtual Machine shares the host system's kernel, while a Container includes a complete guest operating system with its own kernel.", "A Virtual Machine includes a complete guest operating system and runs on a hypervisor, while a Container shares the host operating system's kernel, isolating only the application and its dependencies.", "Containers can only run on physical servers without installed operating systems.", "Virtual machines do not require any physical RAM allocation from the host."], 1]], [["What essentially defines the architecture of an operating system?", ["The amount of RAM installed on the motherboard.", "How the system components are organized and how they interact with each other.", "The type of screen and graphical resolution supported by the monitor.", "The clock speed of the central processor."], 1], ["What is the consequence of a poorly designed OS structure as new features are added?", ["The system becomes faster and consumes less energy.", "The system becomes difficult to maintain, insecure, and inefficient.", "Compatibility with old software automatically increases.", "The need for paging files ceases to exist."], 1], ["What is POSIX standardization (specified by IEEE) in the context of operating systems?", ["A physical protocol for high-speed network cables.", "A set of standards that defines the application programming interface (API), shells, and utilities for compatibility with Unix-like systems.", "An exclusive technology for encrypting SSD hard drives.", "A hardware standard for manufacturing silicon chips."], 1], ["In the context of operating systems, what is an \"abstraction\"?", ["A serious compilation error in the kernel.", "A simplified model that hides low-level hardware details, exposing a useful, secure, and easier-to-use interface.", "A method to overload the CPU with background tasks.", "The complete removal of the file system to save space."], 1], ["What are the main benefits brought by abstraction in an operating system?", ["Simplification, Portability, Protection, and Flexibility.", "Increased CPU temperature and excessive battery consumption.", "Elimination of the need to write programming code.", "Running games without a dedicated video card."], 0], ["How does abstraction act as a security boundary?", ["By preventing the computer from being connected to wireless internet.", "By hiding hardware from direct access and forcing the use of controlled mechanisms (such as file access control and process isolation).", "By automatically deleting suspicious files without warning.", "By shutting down the system as soon as a virus is detected."], 1], ["Describe the simplified flow of a disk read operation using abstraction and system calls:", ["The application reads the disk's magnetic blocks directly with full hardware permission.", "The application makes a system call intercepted by the kernel, which performs the physical I/O operation and returns the result to the application.", "The monitor displays the file on screen before the disk even spins.", "RAM permanently assumes the role of the hard drive."], 1], ["How does the flexibility provided by abstraction help in the evolution of the operating system?", ["It allows modifying the internal implementation (such as changing the file system from FAT32 to NTFS) without applications needing to be rewritten.", "It allows the system to change physical architecture from 32 to 64 bits by itself without restarting.", "It prevents new programs from being installed after the first year of use.", "It makes the computer automatically recover damaged parts."], 0], ["What specifically characterizes a Monolithic Architecture?", ["The kernel is divided into thousands of small independent servers running in user space.", "The entire operating system operates in kernel mode as a single large process.", "The system has no type of file manager.", "All applications run with maximum hardware privileges."], 1], ["What is the main advantage and main disadvantage of a monolithic kernel?", ["Advantage: high performance and efficient communication; Disadvantage: less modularity and risk that a bug crashes the entire system.", "Advantage: maximum security through isolation; Disadvantage: extremely low speed.", "Advantage: extremely small code; Disadvantage: incompatibility with any type of network.", "Advantage: ease of debugging; Disadvantage: inability to run more than one program."], 0], ["How does the Layered Architecture organize the operating system?", ["In a peer-to-peer network without privilege hierarchy.", "By dividing the OS into hierarchical layers, where each layer interacts exclusively with adjacent layers (above and below).", "By placing hardware drivers directly at the user application level.", "By mixing all system functions into a single executable code block."], 1], ["What is the main downside associated with strict Layered Architecture?", ["Total lack of security against external intrusions.", "Performance overhead due to excessive layer crossings.", "Inability to run on modern multi-core computers.", "Need for special RAM memory chips."], 1], ["What defines Microkernel Architecture?", ["A gigantic kernel containing all imaginable drivers and file systems.", "A minimal kernel that runs only essential services (scheduling, IPC, basic memory), while the rest runs in user space.", "An operating system that fits entirely on a 1.44MB floppy disk.", "Software that runs only inside web browsers."], 1], ["What are the reliability and security advantages provided by a microkernel?", ["If a device driver or service fails in user space, it does not necessarily crash the system kernel.", "The system executes arithmetic tasks twice as fast as any other design.", "No password is required to access protected files.", "Computer viruses become physically unable to infect the system."], 0], ["What is the most striking structural performance disadvantage in traditional microkernels?", ["The need to use optical media to boot the computer.", "The performance penalty generated by the high volume of context switches and IPC (Inter-Process Communication) messages.", "Excessive heating of the video card while browsing.", "Slowness in reading simple text files."], 1], ["What is a Loadable Kernel Module (LKM)?", ["A corrupted image file that crashes the operating system on startup.", "A piece of code (such as a hardware driver) that can be dynamically inserted into or removed from the kernel at runtime.", "A text editing tool for beginner programmers.", "An antivirus program that runs in the background in the cloud."], 1], ["What defines a Hybrid Architecture in operating systems?", ["A system that alternates between solar energy and lithium battery.", "A design that combines elements of monolithic kernels and microkernels to balance performance and modularity.", "An OS that runs on both x86 architectures and analog audio processors.", "A system that uses no kernel."], 1], ["How does Windows NT/11 fit into the hybrid architecture category?", ["It keeps most critical services in kernel mode for performance, but uses modular components and the HAL layer.", "It runs entirely as a microkernel with no driver in privileged mode.", "It is built entirely on the original 1981 MS-DOS code.", "It works as a Linux emulator inside a Java virtual machine."], 0], ["What is the base architecture of the XNU kernel used in macOS and iOS?", ["Pure monolithic kernel without support for external modules.", "Hybrid, combining the Mach microkernel with the BSD layer and the I/O Kit.", "Operating system based entirely on a command-line interface.", "Pure microkernel developed exclusively for large servers."], 1], ["What characterizes a Distributed Operating System?", ["An OS that manages a collection of independent computers making them appear as a single cohesive and transparent system for the user.", "An antivirus that distributes updates via email.", "An operating system that only works when disconnected from the local network.", "Software that splits large files into smaller parts across multiple pen drives."], 0], ["What is a context switch?" function render(){quiz.innerHTML='';sel=null;done=false;

function answered(i){const d=quiz.children[i],it=Q[i];if(it.t==='drag')return[...d.querySelectorAll('.drop')].every(z=>!z.classList.contains('empty'));return d.querySelector('input:checked')!==null}
function upd(){let n=0;Q.forEach((_,i)=>{const a=answered(i);if(a)n++;const st=quiz.children[i].querySelector('.st');if(!quiz.children[i].dataset.g)st.textContent=a?'Answer saved':'Not yet answered'});document.getElementById('total').textContent=`Answered: ${n} / ${Q.length}`}
function place(z,c){if(!c)return;const prev=z.dataset.w;if(prev){[...z.closest('.body').querySelectorAll('.chip')].find(x=>x.textContent===prev&&x.classList.contains('used')).classList.remove('used')}
z.textContent=c.textContent;z.dataset.w=c.textContent;z.classList.remove('empty');c.classList.add('used');c.classList.remove('sel');sel=null;upd()}
quiz.addEventListener('click',e=>{if(done)return;const c=e.target.closest('.chip'),z=e.target.closest('.drop');

else if(z){if(sel&&sel.closest('.body')===z.closest('.body'))place(z,sel);else if(z.dataset.w){const w=z.dataset.w;[...z.closest('.body').querySelectorAll('.chip')].find(x=>x.textContent===w&&x.classList.contains('used')).classList.remove('used');delete z.dataset.w;z.textContent='drop here';z.classList.add('empty');upd()}}

quiz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const t=e.target;if(t.classList&&(t.classList.contains('chip')||t.classList.contains('drop'))){e.preventDefault();t.click()}}});

else{const ch=[...d.querySelectorAll('input')].map((x,j)=>x.checked?j:-1).filter(j=>j>=0);ok=ch.length===it.a.length&&ch.every(j=>it.a.includes(j));
