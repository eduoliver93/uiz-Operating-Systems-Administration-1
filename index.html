<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Challenge Quiz — File Systems</title>
<style>
:root{--bg:#fff;--ink:#1d2125;--muted:#4a5560;--box:#c9e4e6;--line:#9fc4c8;--side:#f8f9fa;--sideb:#dee2e6;--link:#0f6cbf;--ok:#2e7d32;--okbg:#d7f0d9;--no:#b3261e;--nobg:#f9d9d6;--chip:#fff;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191c;--ink:#e6eaee;--muted:#a9b4bd;--box:#24464a;--line:#3f6b70;--side:#1e2427;--sideb:#38424a;--link:#6db3f2;--ok:#7bd88a;--okbg:#1f4a27;--no:#ff9b93;--nobg:#5a2622;--chip:#15191c}}
:root[data-theme="dark"]{--bg:#15191c;--ink:#e6eaee;--muted:#a9b4bd;--box:#24464a;--line:#3f6b70;--side:#1e2427;--sideb:#38424a;--link:#6db3f2;--ok:#7bd88a;--okbg:#1f4a27;--no:#ff9b93;--nobg:#5a2622;--chip:#15191c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Open Sans","Segoe UI",Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.q{display:grid;grid-template-columns:130px 1fr;gap:20px;margin-bottom:26px}
.info{background:var(--side);border:1px solid var(--sideb);border-radius:4px;padding:10px;font-size:.8rem;align-self:start}
.info b{font-size:.95rem}.info b span{font-size:1.25rem;margin-left:2px}

.flag{color:var(--link);background:none;border:0;padding:0;font:inherit;cursor:pointer}

.opt.ok{background:var(--okbg)}.opt.no{background:var(--nobg)}
.actions{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button.b{background:var(--link);color:#fff;border:0;border-radius:4px;padding:7px 14px;font:inherit;cursor:pointer}
button.b.g{background:transparent;color:var(--link);border:1px solid var(--link)}
button:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.fb{font-weight:600}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.score{position:sticky;bottom:0;background:var(--side);border:1px solid var(--sideb);border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:640px){.q{grid-template-columns:1fr;gap:8px}.info{display:flex;gap:14px;flex-wrap:wrap}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--sideb);border-radius:10px;padding:0 7px;color:var(--muted)}
.exp{display:none;margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--bg);border-left:4px solid var(--link);font-size:.9rem}
.exp.show{display:block}
.opt.locked{cursor:default}
.opt.miss{outline:2px dashed var(--ok)}
.score b{font-size:1.05rem}
</style>
</head>
<body>
<main>
<h1>Challenge Quiz — Operating Systems &amp; Administration 1</h1>
<p class="sub">Lessons 6, 7 and 8: 60 harder questions with plausible wrong answers, scenarios and multi-select items. Press “Check” after each answer to see the correct option and a short explanation.</p>
<div class="tabs"><button class="b" id="t0">Lesson 6 (20)</button><button class="b g" id="t1">Lesson 7 (20)</button><button class="b g" id="t2">Lesson 8 (20)</button><button class="b g" id="t3">Mixed test — all 60 (random order)</button></div>
<div id="quiz"></div>
<div class="score"><span id="total">Answered: 0 / 20</span><span><button class="b" id="finish">Finish attempt</button> <button class="b g" id="reset">Restart</button></span></div>
</main>
<script>
const R=(l,rows)=>rows.map(r=>{const idx=r[1].map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
return{q:r[0],o:idx.map(i=>r[1][i]),a:r[2].map(c=>idx.indexOf(c)).sort((x,y)=>x-y),e:r[3],l,t:r[2].length>1?'multi':'single'}});
const DATA=[
R(6,[
["Process A and an unrelated process B both hold a file descriptor with the value 3. What can you conclude?",["Both refer to the same open file, since fd numbers are global","Each has its own table, so they may refer to different files","Both share one offset, because the kernel keeps a single fd 3","The kernel would have refused to give B the same number"],[1],"The fd table is per process; the number is just an index into it."],
["A file has two hard links (link count = 2). You remove one name with rm. What happens to the data?",["It is freed at once, because that inode was deleted","It stays, because the inode survives while links remain","It is copied under the other name, then freed","It stays only until the next reboot or fsck"],[1],"unlink() removes a name and decrements the link count. The inode and blocks are released when it reaches 0 and no fd is open."],
["You run chmod 600 on a file without touching its content. Which timestamp is updated?",["mtime","atime","ctime","None, since chmod changes no metadata"],[2],"ctime records the last change to the inode; mtime is for content and atime for access."],
["Process P1 is reading a file. Process P2 deletes it with rm. P1 calls read() again. What happens?",["It fails at once, because the name no longer exists","It succeeds, since the fd still references the open file","It returns end-of-file, because the entry is gone","It blocks until someone recreates the file"],[1],"The fd refers to the open file object, not to the name, so it survives rename and delete."],
["What does a directory entry store?",["A file name and its list of data blocks","A file name and its permission bits","A file name and its inode number","A file name and its open fd number"],[2],"The directory holds the name → inode mapping; everything else lives in the inode."],
["Which TWO items are stored in an inode?",["The number of hard links","The full path from the root","The file name","Pointers to the file’s data blocks"],[0,3],"The inode keeps everything except the name: type, permissions, owner, link count, size, timestamps and block pointers."],
["To resolve /home/user/documents/file.txt starting at the root inode, how many directory lookups are needed?",["Three","Four","Five","One"],[1],"Look up home, user, documents and file.txt in turn; each lookup returns the next inode."],
["A parent opens a file and forks. The child reads 10 bytes through the inherited fd. Where does the parent’s next read() on that fd start?",["At the beginning, since offsets are per process","After those 10 bytes, since the open file object is shared","At byte 10, but only once the child closes the fd","With an error, because the child consumed the fd"],[1],"After fork() the processes share the open file object, including its current offset."],
["A process opens a file for reading, then another user runs chmod 000 on it. What happens at the process’s next read()?",["It fails, because permissions are checked on every read","It succeeds, since access was verified at open()","It fails, unless the process runs as root","It succeeds once, then fails on the following read"],[1],"The kernel verifies access once at open(); later reads and writes do not repeat the check."],
["Which TWO benefits come from using one fd interface for many resources?",["The same read() and write() work on pipes and sockets","Opening a file no longer needs a system call","Unified calls like read(), write() and poll() work on any fd","Every fd number is unique system-wide"],[0,2],"Files, pipes, sockets and devices are all abstracted as file descriptors, which simplifies kernel and user code."],
["Which statement about file extensions on Linux is correct?",["The kernel uses .sh to decide if a file can run","They are conventions that help users and applications","The VFS rejects files whose content mismatches","They are stored in the inode as the file type"],[1],"Extensions are not enforced by Linux."],
["A database engine finds a customer record by key without scanning the file. Which access method is this?",["Sequential","Direct","Indexed","Circular"],[2],"An index maps logical records to physical locations, as in databases."],
["A video player jumps to the 30-minute mark by moving the file pointer to a byte offset. Which access method is this?",["Indexed","Sequential","Circular","Direct"],[3],"Direct (random) access reaches any location through its offset, using seek()."],
["A file shows -rw-r-----. Which TWO statements are true?",["The owner can read and write it","Group members can write to it","Group members can read it","Other users can read it"],[0,2],"Owner rw-, group r--, others ---."],
["A user who is only in the owner’s group tries to create a file in a directory with drwxr-xr-x. What happens?",["It succeeds, because group members may write","It fails, because the group has no write permission","It succeeds, because the group has execute permission","It fails, because only others may create files"],[1],"Creating an entry needs write permission on the directory; the group has r-x only."],
["Which structure plays the role of the inode in NTFS?",["The superblock","The MFT record of the file","The FAT entry of the file","The $Boot sector"],[1],"FCB is the generic term; Windows/NTFS uses MFT records."],
["A program calls read() on an ext4 file and then on a FAT32 USB drive with no code change. What makes this possible?",["The buffer cache","The VFS layer","The fd table","The inode table"],[1],"The VFS gives one uniform interface to many file system types."],
["Why is a second read of the same file often much faster than the first?",["The disk head is already positioned","The blocks are cached in kernel memory","The fd stores a copy of the data","The inode holds the file contents"],[1],"The buffer cache keeps recently used disk blocks in memory, reducing I/O latency."],
["inode #131093 → data blocks [2101–2104] is an example of which view?",["User view","Physical view","Logical view","Application view"],[2],"The logical (system) view maps names and inodes to data blocks."],
["Which order correctly describes what open(\"/home/Documents/file.txt\") does?",["Resolve path to inode, check access, create fd, return its number","Create fd, resolve path to inode, check access, return its number","Check access, return fd number, resolve path, create fd","Resolve path to inode, return fd number, create fd, check access"],[0],"The fd does not exist before the process requests the file; the kernel finds the inode, verifies access and then allocates the fd."]
]),
R(7,[
["Which sequence correctly shows how the OS reaches a file’s data when it is opened?",["Inode table, superblock, inode, data blocks","Superblock, inode table, inode, data blocks","Inode, superblock, data blocks, inode table","Data blocks, inode, superblock, inode table"],[1],"The OS reads the superblock to locate the inode table, then the inode to locate the data blocks."],
["Which identifier does Linux typically use to reference a file system volume, for example when mounting?",["The volume label","The filesystem UUID","The block size","The backup superblock number"],[1],"Linux uses the filesystem UUID rather than the label."],
["Power fails after a journaled update was recorded but before it reached its final place. What happens at reboot?",["The whole disk must be scanned before mounting","The change is silently discarded without any record","The journal is used to replay or roll back the change","The volume must be reformatted and restored from backup"],[2],"Write-ahead logging lets the OS finish or undo the pending operation."],
["Which statement about ext3/ext4 ordered mode is correct?",["File data and metadata are both written to the journal","Only metadata is journaled, but data is written first","Data may be written long after metadata is committed","Nothing is journaled; writes simply happen in order"],[1],"Ordered (the default) journals metadata only, but file data is written in order. Data written long after metadata is writeback mode."],
["Blocks are 4096 bytes. How much space is wasted storing a 5000-byte file?",["904 bytes","1096 bytes","3192 bytes","4096 bytes"],[2],"Two blocks = 8192 bytes; 8192 − 5000 = 3192 bytes of internal fragmentation."],
["A volume stores millions of tiny files. Block size goes from 4 KB to 64 KB. What is the most likely effect?",["Wasted space per file falls sharply","Wasted space per file rises sharply","Fragmentation is eliminated completely","Journaling is automatically disabled"],[1],"Bigger blocks mean more slack in each file’s last block."],
["Which TWO statements correctly compare journaling and COW?",["A journaled change costs two writes: journal, then final location","COW overwrites blocks in place after logging the change","After a crash, a COW file system needs no journal replay","COW needs fsck after every crash to stay consistent"],[0,2],"COW never overwrites live data, so the last consistent metadata tree is always valid."],
["Which TWO statements about fragmentation on SSDs are correct?",["It is logical: more I/O commands and metadata lookups","It slows reads mainly by moving the disk head","The FTL maps logical blocks to physical flash pages","It stops mattering because flash has no wear limits"],[0,2],"No head movement on SSDs, but extra I/O commands remain, and NAND cells still wear out."],
["Why can FAT be slow when reading a large, fragmented file?",["Each cluster’s location comes from following a linked chain","Every read needs an ACL check against the MFT","The journal must be replayed before each read","Extents must be recalculated on every read"],[0],"FAT is a linked-list design: each table entry points to the next cluster."],
["Which TWO are limitations of FAT mentioned in the lessons?",["It has no journaling","It has no built-in permission model","It cannot be used on removable media","It cannot be read by other operating systems"],[0,1],"FAT is simple and universal, but has no journaling, permissions or robustness."],
["Where can the data of a very small NTFS file be stored?",["Only in clusters in the data area","Inside its own MFT record (resident)","Inside the $LogFile","Inside the boot sector"],[1],"The Data attribute can be resident (in the MFT record) or non-resident."],
["Which NTFS metadata file holds the backup copy of the MFT?",["$LogFile","$MFTMirr","$Bitmap","$Boot"],[1],"$MFTMirr is the MFT mirror; $LogFile is the journal."],
["By default, what does the NTFS journal protect after a crash?",["Metadata consistency; file contents are not guaranteed","File contents and metadata, both fully protected","Only the boot sector and the MFT mirror","Nothing; chkdsk is always required to recover"],[0],"NTFS journals metadata by default; file data journaling is optional."],
["Which TWO features are implemented as NTFS attributes?",["Encryption (EFS)","Compression","RAID-Z redundancy","Copy-on-write snapshots"],[0,1],"EFS, compression and disk quotas are all implemented as NTFS attributes."],
["Which feature arrived with ext4 but was not in ext3?",["Journaling","Block groups","Extents","Backward compatibility"],[2],"ext3 added journaling; ext4 added extents, delayed allocation and checksums."],
["Which TWO statements about ZFS and Btrfs are correct?",["ZFS suggests about 1 GB of RAM per TB","Btrfs checksums blocks with CRC32C","ZFS cannot create snapshots","Btrfs cannot use B-trees for metadata"],[0,1],"Both are COW with checksums and snapshots; Btrfs uses B-trees."],
["A contiguous 2 MB file (512 blocks of 4 KB) is described by how many extent entries, ideally?",["512","128","8","1"],[3],"One extent entry (start block, length) covers the whole contiguous range."],
["A program writes a file in many small chunks. Which ext4 feature helps it end up in fewer fragments?",["Delayed allocation","Journal checksumming","Barrier writes","Per-block bitmaps"],[0],"Delaying allocation lets ext4 pick larger contiguous free regions once the size is known."],
["Which TWO are ext4 data-integrity features listed in the lesson?",["Journal checksumming","Metadata checksums in group descriptors","Checksums on all file data blocks","Built-in RAID-Z redundancy"],[0,1],"Per-block data checksums are a ZFS/Btrfs trait, not ext4’s."],
["On a COW file system, block B is modified. What happens first?",["The old block is overwritten in place","The new version is written to a free location","The metadata pointer is switched to the new block","The change is logged in a separate journal"],[1],"New data goes to a new block first; the pointer is updated only afterwards, so old data stays valid meanwhile."]
]),
R(8,[
["lsblk lists a 1 GB device sdb with empty FSTYPE and MOUNTPOINTS columns. What does this mean?",["It is formatted but not yet mounted","It has no file system and is not mounted","It is mounted but its type is unknown","It is a loop device attached to an image"],[1],"A device needs a file system and a mount before use."],
["In the lesson’s example, which device holds the small files the hardware loads first at boot?",["sda2","sda","sda1","sdb"],[2],"sda1 is the small bootable region (mounted on /boot/efi)."],
["A machine has sda (partitioned) and sdb (formatted whole). A third disk is added and partitioned. Its first partition is probably named:",["sdb2","sdc1","sda3","sdd"],[1],"New devices get the next letter; partitions get a number."],
["sdb has a file system but no partition table. Which statement is true?",["It must be mounted as /dev/sdb1","It can be mounted directly as /dev/sdb","It cannot be mounted until it is partitioned","It can only be used as a loop device"],[1],"A whole block device can be formatted without partitioning."],
["To create a 2 GB blank image with dd using bs=1M, which count is right?",["count=2000","count=1024","count=2048","count=4096"],[2],"2048 blocks of 1 MiB = 2 GiB."],
["What does -P do in sudo losetup -fP image.img?",["Makes the loop device persist across reboots","Scans the image and creates its partition devices","Prevents writes by making the image read-only","Picks the largest free loop device number"],[1],"-f picks the first free loop device; -P detects partitions (loopNpM)."],
["After losetup, lsblk shows loop9 (1 GB) with no partitions. What is the next step in the lesson’s workflow?",["Mount it at /mnt/myntfs","Format it with mkfs.ntfs","Partition it with fdisk","Grow it with dd"],[2],"Order: image, losetup, partition, format, mount."],
["In fdisk, which command creates a new GPT partition table?",["n","w","p","g"],[3],"g = new GPT table, n = new partition, w = write changes."],
["In mkfs.ntfs -f /dev/loop9p1 -L NTFS, what is the final NTFS?",["The file system type to create","The volume label","The mount point name","The partition type code"],[1],"mkfs.ntfs already sets the type; -L supplies the label."],
["A loop volume is mounted at /mnt/myntfs and you save report.txt there. Where do the bytes end up?",["In /dev/sda2, the main drive","In the /mnt/ntfs_disk.img file","Only in RAM until you unmount","In the /dev/loop9 device node itself"],[1],"The kernel loops changes back into the image file."],
["After rebooting the VM, which TWO statements are true?",["The .img file still holds the data","The loop device no longer exists","The mount at /mnt/myntfs remains active","loop9p1 is recreated automatically"],[0,1],"Loop devices are created dynamically by the kernel and do not survive a reboot."],
["Which approach makes a loop mount survive a reboot?",["Moving the .img file into /dev","An /etc/fstab entry plus re-attaching with losetup","Using -f instead of -fP in losetup","Mounting under /media instead of /mnt"],[1],"The lesson points to /etc/fstab + losetup automation."],
["Which command creates the partition table but not a partition?",["parted /dev/sdb --script mkpart primary btrfs 0% 100%","parted /dev/sdb --script mklabel gpt","mkfs.btrfs -f /dev/sdb","mkdir /mnt/btrfs_data"],[1],"mklabel makes the table; mkpart makes a partition inside it."],
["You run mkfs.btrfs on a device that already holds a file system, without -f. What is the likely result?",["It overwrites the old file system silently","It refuses; -f is needed to force overwrite","It mounts the old file system instead","It converts the old file system to Btrfs"],[1],"-f means force overwrite."],
["Which package provides ntfsinfo and the tools for inspecting NTFS?",["dosfstools","e2fsprogs","btrfs-progs","ntfs-3g"],[3],"e2fsprogs: ext4; btrfs-progs: Btrfs; ntfs-3g: NTFS; dosfstools: FAT32."],
["Which TWO commands list file system types and UUIDs of block devices?",["lsblk -o NAME,FSTYPE,UUID","sudo blkid","df -i","ntfsls -l"],[0,1],"df -i shows inode usage; ntfsls lists NTFS directory contents."],
["Which TWO commands show ext4 superblock information?",["sudo dumpe2fs -h /dev/sda2","sudo tune2fs -l /dev/sda2","sudo ntfsinfo -m /dev/sdc","sudo btrfs filesystem df /mnt/btrfs"],[0,1],"dumpe2fs -h and tune2fs -l both display the ext superblock."],
["Which command reads a Btrfs superblock safely, read-only?",["sudo dumpe2fs -h /dev/sdb1","sudo fsck.vfat -n -v /dev/sdb1","sudo btrfs inspect-internal dump-super /dev/sdb1","sudo ntfsinfo -m /dev/sdb1"],[2],"The other commands are for ext4, FAT32 and NTFS."],
["On a mounted NTFS volume, ls -i shows inode numbers. What are they?",["Real ext4 inodes translated at mount time","Synthetic numbers provided via FUSE, not Unix inodes","Cluster addresses taken from the FAT table","Block numbers from the $Bitmap file"],[1],"NTFS has no Unix inodes; Linux shows synthetic inode numbers via FUSE."],
["Which value ends the boot sector of a FAT32 volume?",["0xEB3C","0x55AA","0xFFFF","0x0000"],[1],"The boot signature 0x55AA sits at the end of the boot sector."]
])];
const quiz=document.getElementById('quiz'),totalEl=document.getElementById('total');
let Q=[],mode=0;
const L='abcdefgh';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function setMode(k){mode=k;[0,1,2,3].forEach(m=>document.getElementById('t'+m).classList.toggle('g',m!==k));
 Q=k===3?shuffle(DATA[0].concat(DATA[1],DATA[2])):DATA[k].slice();render()}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){quiz.innerHTML='';
 Q.forEach((it,i)=>{const d=el('section','q');d.dataset.i=i;
  const info=el('div','info');const b1=el('div');const bb=el('b','','Question ');bb.append(el('span','',String(i+1)));b1.append(bb);
  const st=el('div','st','Not yet answered');const mk=el('div','','Mark — out of 1.00');
  const tag=el('div');tag.append(el('span','tag','Lesson '+it.l));
  const fl=el('button','flag','⚑ Flag question');fl.setAttribute('aria-pressed','false');
  info.append(b1,st,mk,tag,fl);
  const body=el('div','body');body.append(el('p','',it.q));
  if(it.t==='multi')body.append(el('p','hint','Select all correct answers.'));
  it.o.forEach((t,j)=>{const lab=el('label','opt');const inp=document.createElement('input');inp.type=it.t==='multi'?'checkbox':'radio';inp.name='q'+i;inp.value=j;
   lab.append(inp,el('span','',L[j]+'. '+t));body.append(lab)});
  const ac=el('div','actions');const btn=el('button','b','Check');const fb=el('span','fb');ac.append(btn,fb);body.append(ac);
  const ex=el('div','exp');body.append(ex);
  btn.onclick=()=>check(i);d.append(info,body);quiz.append(d)});
 upd()}
const picked=d=>[...d.querySelectorAll('input')].map((x,j)=>x.checked?j:-1).filter(j=>j>=0);
function upd(){let n=0;[...quiz.children].forEach(d=>{const a=picked(d).length>0;if(a)n++;if(d.dataset.g===undefined)d.querySelector('.st').textContent=a?'Answer saved':'Not yet answered'});
 totalEl.textContent='Answered: '+n+' / '+Q.length}
function reveal(i){const d=quiz.children[i],it=Q[i],fb=d.querySelector('.fb'),ex=d.querySelector('.exp');
 const ch=picked(d);const ok=ch.length===it.a.length&&ch.every(j=>it.a.includes(j));
 d.querySelectorAll('.opt').forEach((l,j)=>{l.classList.remove('ok','no','miss');l.classList.add('locked');l.querySelector('input').disabled=true;
  if(it.a.includes(j)){l.classList.add(ch.includes(j)?'ok':'miss')}else if(ch.includes(j))l.classList.add('no')});
 d.dataset.g=ok?1:0;d.querySelector('.st').textContent='Complete';
 fb.className='fb '+(ok?'ok':'no');
 fb.textContent=ok?'Correct — Mark 1.00 out of 1.00':(ch.length?'Incorrect — Mark 0.00 out of 1.00':'Not answered — Mark 0.00 out of 1.00');
 ex.textContent='Why: '+it.e;ex.classList.add('show')}
function check(i){const d=quiz.children[i];if(d.dataset.g!==undefined)return;
 if(!picked(d).length){const fb=d.querySelector('.fb');fb.className='fb no';fb.textContent='Please answer first.';return}
 reveal(i);upd();score(false)}
function score(final){const gs=[...quiz.children].filter(d=>d.dataset.g!==undefined);const s=gs.filter(d=>d.dataset.g==='1').length;
 if(final)totalEl.textContent='Final score: '+s+' / '+Q.length+' ('+Math.round(s/Q.length*100)+'%)';
 else totalEl.textContent='Answered: '+[...quiz.children].filter(d=>picked(d).length>0).length+' / '+Q.length+(gs.length?'  ·  Correct so far: '+s+' / '+gs.length:'')}
document.getElementById('finish').onclick=()=>{[...quiz.children].forEach((d,i)=>{if(d.dataset.g===undefined)reveal(i)});score(true)};
document.getElementById('reset').onclick=()=>setMode(mode);
quiz.addEventListener('change',upd);
quiz.addEventListener('click',e=>{const f=e.target.closest('.flag');if(f){const on=f.getAttribute('aria-pressed')!=='true';f.setAttribute('aria-pressed',on);f.textContent=(on?'⚑ Unflag':'⚑ Flag')+' question'}});
[0,1,2,3].forEach(m=>document.getElementById('t'+m).onclick=()=>setMode(m));
setMode(0);
</script>
</body>
</html>
