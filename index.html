<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA3 Practice Quiz — File Systems</title>
<style>
:root{--bg:#fff;--ink:#1d2125;--muted:#4a5560;--box:#c9e4e6;--side:#f8f9fa;--sideb:#dee2e6;--link:#0f6cbf;--btn:#fff;--ok:#2e7d32;--okbg:#d7f0d9;--no:#b3261e;--nobg:#f9d9d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191c;--ink:#e6eaee;--muted:#a9b4bd;--box:#24464a;--side:#1e2427;--sideb:#38424a;--link:#6db3f2;--btn:#0b1a26;--ok:#7bd88a;--okbg:#1f4a27;--no:#ff9b93;--nobg:#5a2622}}
:root[data-theme="dark"]{--bg:#15191c;--ink:#e6eaee;--muted:#a9b4bd;--box:#24464a;--side:#1e2427;--sideb:#38424a;--link:#6db3f2;--btn:#0b1a26;--ok:#7bd88a;--okbg:#1f4a27;--no:#ff9b93;--nobg:#5a2622}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Open Sans","Segoe UI",Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0}.sub{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
select{font:inherit;padding:6px;border-radius:4px;background:var(--side);color:var(--ink);border:1px solid var(--sideb)}
.q{display:grid;grid-template-columns:130px 1fr;gap:20px;margin-bottom:26px}
.info{background:var(--side);border:1px solid var(--sideb);border-radius:4px;padding:10px;font-size:.8rem;align-self:start}
.info b span{font-size:1.25rem}.info div{margin:4px 0}
.tag{font-size:.72rem;border:1px solid var(--sideb);border-radius:10px;padding:0 7px;color:var(--muted)}
.body{background:var(--box);border-radius:10px;padding:18px 20px}.body p{margin:0 0 8px}.hint{font-style:italic}
.opt{display:flex;gap:10px;padding:5px 8px;margin:3px 0;border-radius:6px;cursor:pointer}.opt input{margin-top:5px}
.opt.ok{background:var(--okbg)}.opt.no{background:var(--nobg)}.opt.miss{outline:2px dashed var(--ok)}.opt.locked{cursor:default}
.actions{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button.b{background:var(--link);color:var(--btn);border:0;border-radius:4px;padding:7px 14px;font:inherit;cursor:pointer}
button.b.g{background:transparent;color:var(--link);border:1px solid var(--link)}
button:focus-visible,select:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.fb{font-weight:600}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.exp{display:none;margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--bg);border-left:4px solid var(--link);font-size:.9rem}.exp.show{display:block}
.score{position:sticky;bottom:0;background:var(--side);border:1px solid var(--sideb);border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:640px){.q{grid-template-columns:1fr;gap:8px}.info{display:flex;gap:14px;flex-wrap:wrap}}
</style></head><body><main>
<h1>CA3 Practice Quiz — File Systems</h1>
<p class="sub">51 questions covering the 14 topics of the CA3 Moodle quiz. Press “Check” after each answer.</p>
<div class="tabs"><button class="b" id="t0">Exam simulation (20)</button><button class="b g" id="t1">All questions (51)</button>
<select id="topic" aria-label="Practice one topic"></select></div>
<div id="quiz"></div>
<div class="score"><span id="total"></span><span><button class="b" id="finish">Finish attempt</button> <button class="b g" id="reset">Restart</button></span></div>
</main>
<script>
const TOP=["Inodes and directory entries","Linux permissions and ownership","File access and file descriptors","Superblocks and metadata","File allocation methods","Fragmentation","Journaling","Copy-on-write (CoW)","Crash recovery and integrity","File-system types","Block devices and partitions","Mounting file systems","Loop devices and virtual storage","UEFI boot partitions"];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// correct options are given as indexes into the list; they are shuffled on load
const B=[];const Q=(t,q,o,a,e)=>B.push({t,q,o,a,e});
Q(0,"Where is a file’s name stored?",["In the file’s inode, next to its permissions","In its directory entry, paired with an inode number","In the superblock, with global information","In the file’s first data block on disk"],[1],"A directory entry is a name → inode number mapping; the inode holds everything else.");
Q(0,"Which item is NOT stored in an inode?",["Owner and permissions","Link count","File name","Pointers to data blocks"],[2],"The name lives in the directory entry, not in the inode.");
Q(0,"Two directory entries in different directories both point to inode 500. What is this?",["Two hard links to one file","Two symbolic links to one path","Two independent copies of data","A mount point for the volume"],[0],"Hard links are several names for the same inode; the link count is 2.");
Q(1,"A directory is drwxr-x--- (owner alice, group staff). User bob is not in staff and runs ls on it. What happens?",["It lists the contents","Permission denied","It lists names but not metadata","It works because bob has execute"],[1],"Others have no permissions (---), so access is denied.");
Q(1,"What is rwxr-xr-- in octal?",["754","755","744","764"],[0],"rwx=7, r-x=5, r--=4.");
Q(1,"chmod 640 report.txt gives which permissions?",["Owner rw, group r, others none","Owner rwx, group r, others none","Owner rw, group rw, others none","Owner r, group rw, others x"],[0],"6=rw-, 4=r--, 0=---.");
Q(2,"A process has a file open and another process renames it with mv (same file system). What happens at the next read()?",["It fails, because the name changed","It succeeds, since the fd tracks the file","It returns end-of-file immediately","It succeeds only when run as root"],[1],"The fd points to the open file object/inode, which survives a rename.");
Q(2,"A process closes fd 3 and then opens another file. Which fd will it most likely receive?",["3","4","0","A random number"],[0],"The kernel gives the lowest free descriptor number, so 3 is reused.");
Q(2,"Which TWO things does the kernel do while handling open() before returning an fd?",["Resolve the path to an inode","Check permissions for the calling user","Copy the whole file into the fd table","Delete and recreate the inode"],[0,1],"Path lookup, permission check, then allocate the fd entry.");
Q(3,"Which structure stores global file-system information such as size, block count and layout?",["Superblock","Directory entry","File descriptor table","Journal"],[0],"The superblock describes the whole file system.");
Q(3,"ntfsinfo output shows “MFT Record Size” and “Volume Version”. Which file system is this?",["ext4","NTFS","FAT32","Btrfs"],[1],"MFT information identifies NTFS.");
Q(3,"Why does ext4 keep backup copies of the superblock in block groups?",["To speed up normal reads","To recover when the primary copy is damaged","To store the file names","To replace the journal entirely"],[1],"Backups allow fsck to repair a damaged primary superblock.");
Q(4,"Which allocation method gives fast random access but suffers from external fragmentation and trouble growing files?",["Contiguous","Linked","Indexed","Extent-based"],[0],"Contiguous files must find a big enough hole and can’t grow easily.");
Q(4,"What is the main weakness of linked allocation?",["Random access means following the chain","Every file needs a separate index block","It wastes space on large extents","Files can never grow after creation"],[0],"To reach block N you must follow N pointers.");
Q(4,"Indexed allocation supports random access well. What is its extra overhead?",["An index block per file","A pointer inside every data block","A journal entry per write","A bitmap per file"],[0],"The index block is metadata overhead, even for small files.");
Q(5,"Blocks are 4096 bytes. How much internal fragmentation does a 5000-byte file cause?",["904 bytes","1096 bytes","3192 bytes","4096 bytes"],[2],"Two blocks = 8192 bytes; 8192 − 5000 = 3192.");
Q(5,"Why does fragmentation hurt HDD performance more than SSD performance?",["HDDs must move the head between blocks","SSDs cannot be fragmented at all, ever","HDDs always use much smaller blocks","SSDs ignore logical block addresses"],[0],"Seek time dominates on HDDs; SSDs only pay extra I/O commands and metadata lookups.");
Q(5,"How do extents reduce the cost of fragmentation?",["One (start, length) entry covers a whole run","They compress the file data on disk","They remove the need for any journal","They encrypt every block of the file"],[0],"Fewer, larger mappings mean less metadata and fewer fragments.");
Q(6,"What does write-ahead logging mean?",["The change is logged before it is applied","The change is applied first, then logged","Only changes after a reboot are logged","Changes are never logged, only verified"],[0],"The journal entry comes first so it can be replayed or discarded.");
Q(6,"In ext4 data=ordered mode (the default), what is journaled?",["Metadata only, with data written first","Both data and metadata, every write","Nothing, since writes happen in order","File data only, without any metadata"],[0],"Full data journaling is the separate data=journal mode.");
Q(6,"Which file holds the NTFS transaction log?",["$LogFile","$MFTMirr","$Bitmap","$Boot"],[0],"$LogFile is the NTFS journal.");
Q(7,"A block is modified on a CoW file system. What happens?",["It is written to a new block, then linked","The old block is overwritten in place","The old block is erased before writing","The change is kept only in RAM cache"],[0],"Old blocks stay intact until the new version is fully written.");
Q(7,"Why are snapshots and clones cheap on CoW file systems?",["They share unchanged blocks with the original","They copy all the data to a second disk","They compress the original data in place","They reuse the journal as a backup copy"],[0],"Only blocks that change afterwards need new space.");
Q(7,"Which TWO are CoW file systems?",["ZFS","Btrfs","ext4","FAT32"],[0,1],"ext4 uses a journal and FAT32 has no protection at all.");
Q(8,"After a crash, how does a journaled file system avoid scanning the whole disk?",["It replays or rolls back the journal","It runs a full fsck of every block","It reformats all of the metadata","It waits for the user to decide"],[0],"Only the pending operations in the log need attention.");
Q(8,"Why does a CoW file system need no journal replay after a crash?",["The last consistent tree stays untouched","It stores two full copies of every file","It disables all caching of writes","It always runs a full fsck at boot"],[0],"Live data is never modified in place, so the previous state remains valid.");
Q(8,"Which statement about guarantees after a crash on a journaled file system is correct?",["Metadata stays consistent; new data may be lost","All recently written data is always kept","Both metadata and data may be inconsistent","Only the file data is protected by the log"],[0],"Journaling protects consistency, not every last write.");
Q(9,"Which file system uses allocation chains (a table of next-cluster entries) and has no permissions?",["FAT32","ext4","NTFS","ZFS"],[0],"FAT/FAT32 follow cluster chains in the FAT.");
Q(9,"Which file system stores files in an MFT and supports ACLs?",["NTFS","FAT32","ext4","Btrfs"],[0],"NTFS records live in the MFT, with ACL-based security.");
Q(9,"Which pairing is correct?",["ext4 – extents and journal","FAT32 – ACL-based security","NTFS – RAID-Z redundancy","ZFS – FAT cluster chains"],[0],"ZFS and Btrfs use CoW and checksums; ext4 uses extents with a journal.");
Q(10,"lsblk shows sda (with sda1 and sda2) and sdb (no children) with FSTYPE ext4. What does this mean?",["sdb is formatted with no partition table","sdb is empty and has no file system","sda1 is actually a separate disk","sdb is a partition located on sda"],[0],"A whole disk can hold a file system without partitions.");
Q(10,"Two partitions on the same disk:",["Can use different file systems each","Must use the same file system type","Share one superblock between them","Can only be mounted together at once"],[0],"Each partition is its own block device with its own file system.");
Q(10,"In the name sda2, what do “sda” and “2” mean?",["Disk sda, partition 2","Partition sda, disk 2","Second file system on sda","Mount point number 2"],[0],"Letters identify the disk; the number identifies the partition.");
Q(11,"A disk is formatted ext4 and appears in lsblk, but you cannot see its files in the directory tree. What is the likely cause?",["It is not mounted","The journal is full","It is fragmented","Its UUID is wrong"],[0],"A file system must be attached to a mount point to be reachable.");
Q(11,"What does mount /dev/sdb1 /mnt/data do?",["Attaches sdb1 to the directory /mnt/data","Formats sdb1 as a new file system","Copies sdb1 into the /mnt/data folder","Creates a new partition on sdb"],[0],"The mount point is the entry into the file system.");
Q(11,"/mnt/data already contains files. What happens to them while sdb1 is mounted there?",["They are hidden until it is unmounted","They are permanently deleted from disk","They are merged into the sdb1 volume","They are copied onto the sdb1 volume"],[0],"The mounted file system covers the directory’s previous contents.");
Q(12,"A loop device is mounted and you save a file. Where do the bytes end up?",["In the backing image file","Only in RAM until unmounted","Directly in the /dev/sda disk","In the /dev/loop device node itself"],[0],"The kernel redirects reads and writes to the image file.");
Q(12,"Which order is correct for a loop-device workflow?",["Create image, losetup, partition, format, mount","Mount, losetup, format, create image","Format, create image, losetup, mount","losetup, mount, partition, create image"],[0],"The image must exist first; partition and format come before mounting.");
Q(12,"What does losetup -fP image.img do?",["Picks a free loop device, scans partitions","Makes the loop device permanent on reboot","Opens the image file as read-only","Formats the image with a new file system"],[0],"-f picks a free loop device; -P creates loopNpM partition devices.");
Q(13,"What is the purpose of the EFI System Partition (ESP)?",["It holds the boot loaders UEFI loads","It stores swap space for the system","It holds the root file system itself","It stores the user home directories"],[0],"UEFI reads boot loaders from the ESP.");
Q(13,"Which entry is most likely the ESP?",["sda1 512M vfat /boot/efi","sda2 100G ext4 /","sdb 1G (no file system)","loop0 squashfs"],[0],"Small FAT partition mounted at /boot/efi.");
Q(13,"Which file system does the ESP normally use?",["FAT32","ext4","NTFS","Btrfs"],[0],"UEFI firmware is required to support FAT.");
Q(1,"ls -l shows -rwxr-x--x for a file. What can other users do with it?",["Execute it only","Read and execute it","Read it only","Nothing at all"],[0],"Others have --x: execute only, with no read or write.");
Q(4,"Which method most often forces a file to be moved when it grows past its free space?",["Contiguous allocation","Linked allocation","Indexed allocation","Extent-based allocation"],[0],"Contiguous files need free blocks right after them; the other methods can add blocks elsewhere.");
Q(4,"In extent-based allocation, what does each extent describe?",["A run of contiguous blocks (start, length)","A single block and its next pointer","A directory and its entries","A copy of the superblock"],[0],"One extent replaces many per-block pointers, which reduces metadata overhead.");
Q(5,"Is defragmenting an SSD generally worthwhile?",["No, it adds wear for little gain","Yes, it shortens head movement","Yes, it is required for TRIM","No, SSDs cannot hold fragments"],[0],"SSDs have no head to move, and extra writes consume limited flash endurance.");
Q(5,"What does defragmentation do on an HDD?",["Rearranges blocks so files are contiguous","Increases the block size of files","Deletes files that are not used","Rebuilds the journal from scratch"],[0],"Contiguous placement reduces head seeks and speeds up reads.");
Q(6,"Which ext4 journaling mode records both data and metadata in the journal?",["data=journal","data=ordered","data=writeback","data=noatime"],[0],"data=journal is the safest and slowest mode, since data is written twice.");
Q(6,"Which ext4 mode gives the weakest guarantee about file contents after a crash?",["data=writeback","data=ordered","data=journal","They are all the same"],[0],"Writeback journals metadata only and does not order data writes before it.");
Q(8,"What can block checksums detect that a journal alone cannot?",["Silent corruption of stored data","A directory entry left unfinished","A disk that is not mounted","A file with the wrong name"],[0],"Checksums verify block contents on read, as in ZFS and Btrfs.");
Q(9,"Which file system relies on a metadata journal rather than CoW for integrity?",["ext4","Btrfs","ZFS","None of them"],[0],"ZFS and Btrfs are CoW with checksums; ext4 uses a journal.");
const DATA=B.map(r=>{const idx=shuffle(r.o.map((_,i)=>i));return{t:r.t,q:r.q,o:idx.map(i=>r.o[i]),a:r.a.map(c=>idx.indexOf(c)).sort(),e:r.e,m:r.a.length>1}});
const quiz=document.getElementById('quiz'),tot=document.getElementById('total'),sel=document.getElementById('topic');
TOP.forEach((n,i)=>sel.add(new Option('Topic: '+n,i)));sel.insertBefore(new Option('Practice one topic…',''),sel.firstChild);sel.value='';
let cur=[],mode=0,final=false;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
function setMode(k){mode=k;final=false;document.getElementById('t0').classList.toggle('g',k!==0);document.getElementById('t1').classList.toggle('g',k!==1);if(k!==2)sel.value='';
 if(k===0){const one=TOP.map((_,t)=>shuffle(DATA.filter(d=>d.t===t))[0]);const rest=shuffle(DATA.filter(d=>!one.includes(d))).slice(0,6);cur=shuffle(one.concat(rest))}
 else if(k===1)cur=DATA.slice();else cur=DATA.filter(d=>d.t===+sel.value);render()}
function render(){quiz.innerHTML='';cur.forEach((it,i)=>{const d=el('section','q'),info=el('div','info'),b=el('b','','Question ');b.append(el('span','',String(i+1)));
 const g=el('div');g.append(b);const t=el('div');t.append(el('span','tag',TOP[it.t]));info.append(g,el('div','st','Not yet answered'),t);
 const body=el('div','body');body.append(el('p','',it.q));if(it.m)body.append(el('p','hint','Select all correct answers.'));
 it.o.forEach((x,j)=>{const l=el('label','opt'),n=document.createElement('input');n.type=it.m?'checkbox':'radio';n.name='q'+i;l.append(n,el('span','','abcdef'[j]+'. '+x));body.append(l)});
 const ac=el('div','actions'),bt=el('button','b','Check');bt.onclick=()=>check(i);ac.append(bt,el('span','fb'));body.append(ac,el('div','exp'));d.append(info,body);quiz.append(d)});upd()}
const picked=d=>[...d.querySelectorAll('input')].map((x,j)=>x.checked?j:-1).filter(j=>j>=0);
function upd(){const ds=[...quiz.children],gs=ds.filter(d=>d.dataset.g!==undefined),s=gs.filter(d=>d.dataset.g==='1').length;
 ds.forEach(d=>{if(d.dataset.g===undefined)d.querySelector('.st').textContent=picked(d).length?'Answer saved':'Not yet answered'});
 tot.textContent=final?'Final score: '+s+' / '+cur.length+' ('+Math.round(s/Math.max(cur.length,1)*100)+'%)':'Answered: '+ds.filter(d=>picked(d).length).length+' / '+cur.length+(gs.length?'  ·  Correct so far: '+s+' / '+gs.length:'')}
function reveal(i){const d=quiz.children[i],it=cur[i],ch=picked(d),ok=ch.length===it.a.length&&ch.every(j=>it.a.includes(j)),fb=d.querySelector('.fb'),ex=d.querySelector('.exp');
 d.querySelectorAll('.opt').forEach((l,j)=>{l.classList.add('locked');l.querySelector('input').disabled=true;if(it.a.includes(j))l.classList.add(ch.includes(j)?'ok':'miss');else if(ch.includes(j))l.classList.add('no')});
 d.dataset.g=ok?1:0;d.querySelector('.st').textContent='Complete';fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'Correct':(ch.length?'Incorrect':'Not answered');
 ex.textContent='Why: '+it.e;ex.classList.add('show')}
function check(i){const d=quiz.children[i];if(d.dataset.g!==undefined)return;if(!picked(d).length){const f=d.querySelector('.fb');f.className='fb no';f.textContent='Please answer first.';return}reveal(i);upd()}
document.getElementById('finish').onclick=()=>{[...quiz.children].forEach((d,i)=>{if(d.dataset.g===undefined)reveal(i)});final=true;upd()};
document.getElementById('reset').onclick=()=>setMode(mode);
document.getElementById('t0').onclick=()=>setMode(0);document.getElementById('t1').onclick=()=>setMode(1);
sel.onchange=()=>{if(sel.value!=='')setMode(2)};
quiz.addEventListener('change',upd);
setMode(0);
</script></body></html>
