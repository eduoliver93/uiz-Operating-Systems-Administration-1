attery power consumption inside modern electric vehicles and hybrid cars, in typical setups, within the system."], 0], ["What characteristics do Mobile Operating Systems (Mobile OS) prioritize?", ["Exclusive connection to 21-inch cathode ray tube monitors, in real-world use, across the industry.", "Touch-based interfaces, energy efficiency (battery), strict security, and integrated support for mobility and sensors.", "Command-line interfaces based on punch cards, across the industry, within the system.", "Exclusive processing of quantum artificial intelligence algorithms, across the industry, within the system."], 1], ["What are the central properties of an Embedded Operating System?", ["Requiring daily manual updates performed personally by a team of specialized on-site hardware engineers, for most users, in this scenario.", "Working exclusively on massive supercomputers dedicated entirely to classified nuclear research programs, for simplicity, on most systems.", "Minimal memory footprint, high reliability, often real-time, optimized for specific and limited hardware (e.g., routers, home appliances).", "Heavy graphical interfaces with highly complex 3D animations, in real-world use, across the industry."], 2], ["What is the function of a Type 1 Hypervisor (Bare-Metal) in virtualized systems?", ["Converting digital audio files back into outdated analog formats for playback on vintage recording equipment, in typical setups, on most systems.", "Running merely as an ordinary application installed inside a conventional desktop operating system like Windows, by default, across the industry.", "Protecting local corporate networks against distributed denial-of-service attacks launched from the internet, in modern systems, in common usage.", "Installing directly on physical hardware to create and host multiple virtual machines (VMs) with their own operating systems (e.g., VMware ESXi)."], 3], ["How does a Type 2 Hypervisor (Hosted) differ from a Type 1 Hypervisor?", ["Type ace, it does not necessarily crash the system kernel."], 3], ["What is the most striking structural performance disadvantage in traditional microkernels?", ["The performance penalty generated by the high volume of context switches and IPC (Inter-Process Communication) messages.", "The need to use optical media to boot the computer, in modern systems, across the industry.", "Excessive heating of the video card while browsing, in typical setups, across the industry.", "Slowness in reading simple text files, in modern systems, across the industry."], 0], ["What is a Loadable Kernel Module (LKM)?", ["An antivirus program that runs in the background in the cloud, in typical setups, across the industry.", "A piece of code (such as a hardware driver) that can be dynamically inserted into or removed from the kernel at runtime.", "A corrupted image file that crashes the operating system on startup, in real-world use, across the industry.", "A text editing tool for beginner programmers, in modern systems, across the industry."], 1], ["What defines a Hybrid Architecture in operating systems?", ["A system that uses no kernel, in typical setups, across the industry.", "An OS that runs on both x86 architectures and analog audio processors, for most users, across the industry.", "A design that combines elements of monolithic kernels and microkernels to balance performance and modularity.", "A system that alternates between solar energy and lithium battery, in real-world use, across the industry."], 2], ["How does Windows NT/11 fit into the hybrid architecture category?", ["It runs entirely as a microkernel with no driver in privileged mode, in real-world use, across the industry.", "It works as a Linux emulator inside a Java virtual machine, in modern systems, across the industry.", "It is built entirely on the original 1981 MS-DOS code, in real-world use, across the industry.", "It keeps most critical services in kernel mode for performance, but uses modular components and the HA ity tools like SELinux add to a monolithic kernel like Linux?", ["The complete removal of all common user accounts from the system, in typical setups, across the industry.", "An integrated graphical antivirus that automatically removes infected files, in most cases, within the system.", "The ability to encrypt the computer monitor via hardware, in real-world use, across the industry.", "Extra layers of mandatory access control (MAC), increasing security at the cost of a slight execution overhead."], 3], ["What is the specific function of the Hardware Abstraction Layer (HAL) in Windows regarding portability?", ["Isolate the kernel from physical variations of the underlying hardware, facilitating system portability to different motherboards and chipsets.", "Manage only the wireless connection used for pairing with nearby Bluetooth peripherals and accessories, in common usage, across the industry.", "Replace the physical video card entirely with a virtual graphics processor running somewhere in the cloud, in standard use, within the system.", "Shut the entire computer down automatically once the CPU temperature exceeds a predefined safe limit, across the industry, within the system."], 0], ["What differentiates the scalability priority between old operating systems (like MS-DOS) and modern systems?", ["Old systems were actually focused primarily on supporting very high-capacity, large-scale cloud server farms, in typical setups, across the industry.", "Old systems focused on simplicity for a single single-user machine; modern systems handle massive multithreading, multicore, and distributed cloud environments.", "Modern operating systems simply no longer support any kind of single-user personal computer whatsoever, in modern systems, across the industry.", "There has been absolutely no evolution at all in scalability priorities throughout the computing decades, in modern systems, across the industry."], 1], ["Why do operating systems aimed at embedded devices prioritiz
