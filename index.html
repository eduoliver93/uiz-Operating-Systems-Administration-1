<h1>Study Quiz — Operating Systems &amp; Administration 1</h1>
<p class="sub">Lesson 3 (Process Management) and Lesson 4 (Threads and Scheduling): 60 questions. Press “Check” after each answer to see the correct option and a short explanation.</p>

<script>
const DATA=[[{"q": "What is the key difference between a program and a process?", "o": ["A program is an active entity in memory, while a process is a static file on disk.", "A program always creates exactly one process, while a process can contain many programs.", "A program is a passive file on disk, while a process is a program in execution.", "A program needs a CPU scheduler to run, while a process runs without any OS support."], "a": [2], "e": "A program is static (an executable file on disk); a process is dynamic: a program in execution with its own context. One program can spawn several processes, e.g. multiple browser windows.", "l": 3, "t": "single"}, {"q": "Which TWO regions belong to the address space of a process?", "o": ["The PCB, holding the saved CPU registers of the process at the last switch.", "The scheduler log, holding the CPU time that each process has already used.", "The ready queue, holding every process that is waiting for the CPU to run.", "The heap, holding memory that is allocated dynamically during execution.", "The stack, holding function calls, local variables and return addresses."], "a": [3, 4], "e": "A process memory image has four regions: text (code), data (globals), heap (dynamic memory) and stack. The PCB and ready queue are OS structures, not part of the process address space.", "l": 3, "t": "multi"}, {"q": "Which TWO items are part of the execution context that the OS saves and restores in a context switch?", "o": ["The program counter, which points to the next instruction to execute.", "The compiled source file, which is reloaded from the disk on every switch.", "The CPU register values, which hold working variables and intermediate results.", "The whole heap region, which is copied to disk on every single switch.", "The full text section, which contains every instruction of the program."], "a": [0, 2], "e": "The execution context (PC, CPU registers, stack pointer, open file descriptors, memory mappings) is the dynamic state of the process. It is not a labelled region of the address space.", "l": 3, "t": "multi"}, {"q": "Processes are described as an abstraction of which resource?", "o": ["The disk, giving each program the illusion of owning the whole storage device.", "The network card, giving each program the illusion of a private connection.", "The RAM chips, giving each program the illusion of unlimited physical memory.", "The CPU, giving each program the illusion of exclusive access to the processor."], "a": [3], "e": "The OS time-shares (virtualises) the CPU across processes, so each program appears to have the processor to itself.", "l": 3, "t": "single"}, {"q": "In CPU virtualisation, what is the difference between policy and mechanism?", "o": ["Policy decides which process runs next, and mechanism is how to context switch.", "Policy is how to context switch, and the mechanism decides which process runs next.", "Policy is the PCB layout, and mechanism is the structure of the page tables.", "Policy is the hardware timer, and mechanism is the size of each time slice."], "a": [0], "e": "Policy answers \"which process to run\" (the CPU scheduler). Mechanism answers \"how to switch between processes\" (the context switch).", "l": 3, "t": "single"}, {"q": "Which list shows the five states of the classic process model?", "o": ["New, Ready, Running, Swapped, Zombie, Terminated.", "New, Ready, Running, Waiting (Blocked), Terminated.", "Created, Idle, Running, Blocked, Orphaned.", "Created, Queued, Spinning, Sleeping, Finished."], "a": [1], "e": "Classic 5-state model: New (being created), Ready (waiting for CPU), Running, Waiting/Blocked (waiting for an event such as I/O) and Terminated.", "l": 3, "t": "single"}, {"q": "A running process requests a disk read. Which state transition happens?", "o": ["Running to Ready, because the timer interrupt has just taken the CPU away.", "Running to Terminated, because requesting I/O ends the execution of a process.", "Running to Waiting (Blocked), because it must wait for the I/O to complete.", "Ready to Running, because the dispatcher selected it for the CPU just now."], "a": [2], "e": "A process that requests I/O cannot continue, so it moves Running to Blocked. Running to Ready happens on pre-emption or yield.", "l": 3, "t": "single"}, {"q": "The I/O that a blocked process was waiting for completes. What happens next?", "o": ["It moves from Blocked straight to Running and pre-empts the current process.", "It moves from Blocked back to New and its PCB is created from scratch.", "It moves from Blocked to Terminated and its resources are released to the OS.", "It moves from Blocked to Ready and waits until the scheduler picks it."], "a": [3], "e": "Completion of the event makes the process ready to run again (Blocked to Ready). It still needs the scheduler to select it (Ready to Running).", "l": 3, "t": "single"}, {"q": "What does it mean when a process is pre-empted?", "o": ["The OS forcibly takes the CPU away although the process has not finished.", "The process gives up the CPU voluntarily after it has finished its work.", "The process is moved out to disk because the main memory is running short.", "The process waits for an I/O event to complete before it can continue."], "a": [0], "e": "Pre-emption is the OS interrupting a running process (e.g. when its time slice expires). The process returns to the Ready state.", "l": 3, "t": "single"}, {"q": "Why can the OS move a waiting or blocked process into a swapped-out state?", "o": ["To raise the clock speed of the CPU while the process image remains on the disk.", "To free scarce main memory by moving the process image to swap space on disk.", "To give the blocked process a higher priority when it returns to memory.", "To end the process because it has used up its time slice for this period."], "a": [1], "e": "Suspended (swapped) states let the OS free main memory when it is scarce. The process is swapped back in when resources are available.", "l": 3, "t": "single"}, {"q": "A process in the state \"Swapped Out and Blocked\" is swapped back into memory. What is its new state?", "o": ["Ready, because having memory again means that it can use the CPU at once.", "Running, because the OS gives priority to processes returning from swap.", "Blocked, and it stays blocked until the event it is waiting for completes.", "Terminated, because a swapped process cannot keep its original state intact."], "a": [2], "e": "Swap-in does not complete the event. The process returns to Blocked and only becomes Ready once the I/O or event completes.", "l": 3, "t": "single"}, {"q": "What is a Process Control Block (PCB)?", "o": ["The hardware register that stores the address of the next instruction to execute.", "The user-space library that schedules the threads running inside one process.", "The disk partition where the images of inactive processes are kept in storage.", "The kernel data structure storing the information needed to manage and resume a process."], "a": [3], "e": "The PCB is the fundamental per-process data structure of the OS. Without it, multitasking and context switching would be impossible.", "l": 3, "t": "single"}, {"q": "Which TWO items are typically stored in a PCB?", "o": ["The full source code that the programmer wrote.", "The saved program counter and CPU registers.", "The process ID (PID) and the parent process ID.", "The list of every file stored on the hard disk.", "The firmware settings of the motherboard."], "a": [1, 2], "e": "A PCB holds identification (PID, PPID, user ID), processor state (PC, registers), scheduling info, memory management info, accounting info and I/O status (open files, devices).", "l": 3, "t": "multi"}, {"q": "Which pairing of operating system and process structure is correct?", "o": ["Linux uses task_struct, and Windows uses EPROCESS in kernel space.", "Linux uses EPROCESS, and Windows uses task_struct inside kernel space.", "Linux uses proc only, and Windows uses Mach tasks in kernel space.", "Linux uses ETHREAD, and macOS uses EPROCESS in kernel space."], "a": [0], "e": "Linux: task_struct. Windows: EPROCESS (plus an ETHREAD per thread). macOS (XNU): a Mach task combined with a BSD proc structure.", "l": 3, "t": "single"}, {"q": "According to the lesson, which benefits does the PCB provide?", "o": ["Compression, encryption and portability, enabling remote file transfers.", "Correctness, isolation and efficiency, enabling pre-emptive multitasking.", "Fragmentation, aging and paging, enabling the swapping of the memory.", "Bandwidth, latency and jitter, enabling faster delivery of the packets."], "a": [1], "e": "Correctness: processes resume exactly where they left off. Isolation: a private execution context. Efficiency: pre-emptive multitasking and fair scheduling.", "l": 3, "t": "single"}, {"q": "How does a kernel/user mode switch differ from a context switch?", "o": ["A mode switch loads a different PCB, whereas a context switch only changes the privilege level.", "A mode switch happens only between two processes, whereas a context switch does not.", "A mode switch keeps the same process running, whereas a context switch changes process.", "They are the same operation, known by two different names in the textbooks."], "a": [2], "e": "On a system call or interrupt the same process moves between user and kernel mode; its PCB and memory context do not change. A context switch saves one PCB and loads another.", "l": 3, "t": "single"}, {"q": "Which TWO events cause a kernel/user mode switch?", "o": ["A hardware interrupt that the OS must handle.", "The process adds two numbers held in registers.", "The process writes to a local variable on the stack.", "A system call such as read() or open().", "The process reads a global variable in its data section."], "a": [0, 3], "e": "System calls and interrupts move the CPU from user mode to kernel mode. Ordinary instructions executing in user mode do not.", "l": 3, "t": "multi"}, {"q": "What is saved to the PCB during a context switch?", "o": ["The complete contents of the disk, the page cache and every open network socket.", "Only the source files and compiled binaries of the process that is being stopped.", "The BIOS settings, the boot sector and the partition table of the main drive.", "The program counter, CPU registers, memory-management info, state and accounting info."], "a": [3], "e": "The OS stores the PC, registers, memory-management information (page/segment tables), process state and CPU usage accounting so the process can be resumed later.", "l": 3, "t": "single"}, {"q": "Which TWO events can trigger a context switch?", "o": ["A process issues an I/O request and blocks.", "The process writes a value to its own stack.", "The process increments a counter held in a register.", "The process reads a constant from its code section.", "A timer interrupt when the time slice expires."], "a": [0, 4], "e": "Context switches occur on timer interrupts (pre-emption), blocking I/O or system calls, interrupts, and when a higher-priority process becomes ready.", "l": 3, "t": "multi"}, {"q": "Why is a context switch considered overhead?", "o": ["The CPU does no useful work while it saves and restores registers and disturbs caches.", "The CPU runs at a reduced clock speed while it is busy switching between two processes.", "The memory is erased and reloaded from disk every time that a switch takes place.", "The user must confirm every switch before the new process is allowed to start."], "a": [0], "e": "Saving/restoring registers, flushing pipelines and cache disruption mean no useful work is done during the switch. More frequent switches mean less efficiency.", "l": 3, "t": "single"}, {"q": "What is the effect of using very short CPU time slices?", "o": ["A tiny share of CPU time is spent on switching, so throughput always improves.", "A large share of CPU time is wasted on switching, though responsiveness improves.", "Processes can never be pre-empted, so the system behaves like a batch system.", "Processes keep the CPU until they block, so interactive tasks are starved."], "a": [1], "e": "Short slices give good responsiveness but a high proportion of CPU time is lost to context switching. Long slices waste little time but reduce responsiveness.", "l": 3, "t": "single"}, {"q": "Why is a thread context switch within one process cheaper than a process switch?", "o": ["Threads run in kernel mode only, so no registers ever have to be saved or restored.", "Threads have their own page tables, so the memory context is already loaded.", "Threads share the memory space, so only registers and the stack need switching.", "Threads never get pre-empted, so the scheduler is never involved in the switch."], "a": [2], "e": "A process switch involves switching memory context, page tables and file tables. Threads of the same process share these, making their switches lightweight.", "l": 3, "t": "single"}, {"q": "In UNIX/Linux, what do fork() and exec() do?", "o": ["fork() loads a new program into memory; exec() duplicates the parent as a new child.", "fork() terminates the parent process; exec() starts the child at a new address.", "fork() assigns a new PID to the kernel; exec() frees all the memory of the parent.", "fork() duplicates the parent to create a child; exec() replaces the child's memory image."], "a": [3], "e": "fork() creates a child with a new PID as a copy of the parent. exec() overwrites the child's memory with a new program. wait() lets the parent wait for the child.", "l": 3, "t": "single"}, {"q": "How does process creation in Windows compare with UNIX?", "o": ["Windows uses one CreateProcess() call, while UNIX typically combines fork() and exec().", "Windows uses fork() and exec() together, while UNIX uses a single CreateProcess() call instead.", "Windows and UNIX both use only fork(), but with different security attributes.", "Windows has no API for creating processes, so the kernel creates every process."], "a": [0], "e": "CreateProcess() creates the process and loads the executable in one call, with more control (security attributes, environment, priority).", "l": 3, "t": "single"}, {"q": "Which of these is an involuntary process termination?", "o": ["A program finishing its work and then calling exit() to return control.", "A fatal error such as a divide-by-zero or a memory access violation.", "A program detecting bad user input and then terminating itself on purpose.", "A program completing its main loop and releasing all of its own resources."], "a": [1], "e": "Voluntary: normal exit and error exit. Involuntary: fatal error (illegal instruction, divide by zero, memory violation) or being killed by another process or the OS.", "l": 3, "t": "single"}, {"q": "What is an orphan process in UNIX/Linux?", "o": ["A child that has terminated while its parent has not yet called wait().", "A process that is blocked forever while it waits for an I/O device to reply.", "A child whose parent exited first, which is then adopted by init/systemd.", "A process that was swapped out to disk and can never be swapped back in."], "a": [2], "e": "If the parent exits before the child, the child becomes an orphan and is adopted by init (PID 1, now systemd). A terminated child not yet waited for is a zombie.", "l": 3, "t": "single"}, {"q": "What is a zombie process?", "o": ["A running child whose parent was killed and which init/systemd adopted.", "A blocked process whose swapped-out image can no longer be found on disk.", "A thread that keeps spinning on a lock which another thread already freed.", "A terminated child whose PCB remains until the parent calls wait()."], "a": [3], "e": "A zombie has finished, but the parent has not collected its exit status, so its PCB entry stays in the process table until wait() is called.", "l": 3, "t": "single"}, {"q": "In UNIX-like systems, which process is the ancestor of all other processes?", "o": ["init (PID 1), which is now usually systemd.", "The shell (bash), which is started by every user login.", "csrss.exe, which is started by the session manager.", "The idle thread, which runs when no process is ready."], "a": [0], "e": "All processes descend from init (PID 1, now systemd). You can see the hierarchy with pstree -p. In Windows, smss.exe and wininit.exe spawn application processes.", "l": 3, "t": "single"}, {"q": "Which scheduler controls the degree of multiprogramming?", "o": ["The short-term scheduler, which picks the next ready process to run.", "The long-term scheduler, which admits jobs into the system.", "The medium-term scheduler, which picks the next instruction to fetch.", "The dispatcher, which decides how many jobs may be created at boot."], "a": [1], "e": "Long-term: admission of jobs (degree of multiprogramming). Medium-term: suspends/resumes (swaps) processes. Short-term (CPU): chooses which ready process gets the CPU.", "l": 3, "t": "single"}, {"q": "Which statement about non-pre-emptive and pre-emptive scheduling is correct?", "o": ["Non-pre-emptive can interrupt a process at any time; pre-emptive never interrupts it.", "Both interrupt processes, but only pre-emptive scheduling uses a timer for it.", "Non-pre-emptive keeps the CPU until block or finish; pre-emptive can interrupt a process.", "Neither interrupts processes, but only pre-emptive scheduling uses a queue."], "a": [2], "e": "FCFS is non-pre-emptive; Round Robin is pre-emptive. Pre-emption improves responsiveness but adds context-switching overhead.", "l": 3, "t": "single"}], [{"q": "How do threads differ from processes in terms of sharing and isolation?", "o": ["Threads are isolated from each other; processes share memory and therefore need no IPC at all.", "Threads and processes both share all memory, but only processes have a PCB.", "Threads share their process memory and resources; processes are isolated and need IPC.", "Threads and processes are both isolated, but threads are always created slower."], "a": [2], "e": "Threads in one process share the address space (fast, easy data exchange but risk of races). Processes are isolated (safer) and must use explicit IPC such as pipes, sockets or shared memory.", "l": 4, "t": "single"}, {"q": "Which TWO are benefits of multithreading?", "o": ["Responsiveness, because the UI stays live while background work proceeds.", "Slower creation than processes, because each thread needs a private address space.", "Guaranteed absence of deadlocks, because the kernel orders every lock request.", "Automatic freedom from race conditions, because threads are scheduled fairly.", "Throughput and scalability, because many cores give genuine parallel speedups."], "a": [0, 4], "e": "Benefits: responsiveness, throughput/scalability (when correctly synchronised) and economy (cheaper than processes to create and switch). Races and deadlocks are costs, not benefits.", "l": 4, "t": "multi"}, {"q": "Two threads each read balance = 100, add 10, and write the result back. What can the final value be?", "o": ["120, because the scheduler always runs the two additions one after the other.", "100, because the second write always restores the value the first one read.", "130, because each thread adds its own 10 and then adds the old value again.", "110, because both threads read 100 before either one wrote its new value back."], "a": [3], "e": "This is a race: the outcome depends on the order of execution. With an unlucky interleaving the result is 110 instead of the expected 120.", "l": 4, "t": "single"}, {"q": "What is a race condition?", "o": ["A bug whose result depends on the timing of threads accessing shared data.", "A speed contest between two schedulers competing for the same CPU core.", "A situation where a thread waits forever for a lock that nobody holds.", "A method that lets a faster thread finish ahead of a slower one on purpose."], "a": [0], "e": "A race occurs when threads access or modify the same shared data at the same time. The race condition is the resulting bug; it is often intermittent and hard to reproduce.", "l": 4, "t": "single"}, {"q": "Round Robin with quantum q = 4 ms. P1 (24 ms), P2 (3 ms) and P3 (3 ms) all arrive at time 0 in that order. When does P3 finish?", "o": ["At 30 ms: P1 runs to completion first, then P2 runs, and then P3 runs.", "At 10 ms: P1 runs 0 to 4, P2 4 to 7 and P3 7 to 10.", "At 7 ms: P1 runs 0 to 4, then P3 runs 4 to 7 before P2 can run.", "At 13 ms: P1 runs 0 to 4, P2 4 to 7, P1 7 to 11, and P3 11 to 13."], "a": [1], "e": "P1 uses its first 4 ms slice (0-4) and goes to the back; P2 needs only 3 ms (4-7) and finishes; P3 needs 3 ms (7-10) and finishes. P1 then completes its remaining 20 ms.", "l": 4, "t": "single"}, {"q": "What are user-level threads (ULTs)?", "o": ["Threads created and scheduled directly by the kernel, with one run-queue entry for each.", "Threads that run only in kernel mode and need a system call for every switch.", "Threads managed by a library in user space; the kernel sees one schedulable entity.", "Threads that map one to one onto CPU cores and cannot be moved by the OS."], "a": [2], "e": "ULTs are created, scheduled and switched by a user-space library, without system calls, so they are very fast. The kernel only knows about the owning process.", "l": 4, "t": "single"}, {"q": "What happens in a process using ULTs when one thread makes a blocking system call?", "o": ["Only that thread blocks, because the kernel schedules the other threads.", "The library moves the thread to another CPU core so that the call finishes.", "The kernel creates a new process for the other threads so that they continue.", "The whole process blocks, because the kernel cannot see the other threads."], "a": [3], "e": "With ULTs the kernel sees a single schedulable entity, so one blocking call (e.g. read()) blocks every thread in that process, unless the library uses non-blocking I/O.", "l": 4, "t": "single"}, {"q": "Which TWO are advantages of kernel-level threads (KLTs)?", "o": ["Lower memory use than user-level threads.", "True parallelism on multiple cores.", "Thread creation that needs no system call.", "Custom scheduling policy defined in user space.", "A blocking call in one thread does not stop the others."], "a": [1, 4], "e": "The kernel schedules each KLT separately, so threads can run on different cores and a blocked thread does not freeze its siblings. The cost is slower creation and switching and more kernel data structures.", "l": 4, "t": "multi"}, {"q": "What is the combined (M:N) threading model?", "o": ["Many user threads are mapped onto fewer kernel threads, balancing speed and parallelism.", "One user thread is mapped onto each kernel thread, giving the highest overhead.", "Many kernel threads are mapped onto one user thread, which limits parallelism.", "Every thread is mapped onto a single kernel thread, so all of them run in turn."], "a": [0], "e": "M:N combines the speed of ULTs with the parallelism of KLTs, at the cost of more complexity.", "l": 4, "t": "single"}, {"q": "In the ULT/KLT dependency, what is a lightweight process (LWP)?", "o": ["A process that is created without a PCB so that it uses less memory.", "A virtual processor bound to a user thread by the thread library.", "A kernel thread that can only run when the system is in the idle state.", "A user thread that has been swapped out to the disk to free some memory."], "a": [1], "e": "Each ULT is associated with a virtual processor called an LWP. When a system call is invoked, a kernel-level thread is created and scheduled onto the LWPs by the system scheduler.", "l": 4, "t": "single"}, {"q": "What is the purpose of a mutex?", "o": ["It lets any number of threads enter a critical section at the same time.", "It orders threads by priority so that the shortest burst always runs first.", "It lets only one thread at a time enter a critical section.", "It counts how many resources are free and wakes a thread when one is released."], "a": [2], "e": "A mutex (mutual exclusion lock) protects shared data: lock() before the critical section and unlock() after. Other threads block until it is released.", "l": 4, "t": "single"}, {"q": "Which is a disadvantage of a mutex?", "o": ["If the holder finishes quickly, the other threads can all enter the section too.", "If two threads lock it, the kernel always breaks it and then resets the data.", "If the lock is held, the scheduler always gives the holder a lower priority.", "If the holder sleeps or is pre-empted inside the section, all others must wait."], "a": [3], "e": "A mutex has no mechanism to forcibly unlock or bypass it. If the holder is pre-empted or sleeps inside the critical section, others wait (possible starvation), and implementations may busy-wait and waste CPU cycles.", "l": 4, "t": "single"}, {"q": "How does a counting semaphore work?", "o": ["It holds a count of permits; wait() decrements it, signal() increments it, and 0 blocks.", "It holds a count of threads; wait() increments it, signal() decrements it, and 0 runs.", "It holds a lock owner; wait() sets the owner, signal() clears it, and 0 means free.", "It holds a priority value; wait() raises it, signal() lowers it, and 0 means idle."], "a": [0], "e": "A semaphore S counts available permits. wait() takes a permit (S decremented); if S = 0 the thread blocks. signal() releases a permit (S incremented) so a waiting thread can proceed. The check-and-take is atomic.", "l": 4, "t": "single"}, {"q": "A semaphore is initialised to 5 for a car park. Three cars have entered and none have left. What is the semaphore value?", "o": ["3, because it counts the number of cars that are inside the car park.", "2, because it counts the permits that are currently still available.", "5, because it always equals the total number of parking spaces there.", "0, because the gatekeeper has already blocked every car that arrived."], "a": [1], "e": "5 permits minus 3 taken = 2. The count shows permits currently available, not the total number of spaces. Cars that arrive when the count is 0 must wait.", "l": 4, "t": "single"}, {"q": "When is a spinlock preferable to a sleep lock?", "o": ["For very long waits, since busy-waiting frees the CPU for all other processes.", "For I/O-heavy sections, since busy-waiting hides the disk latency totally.", "For very short waits, since busy-waiting avoids the cost of a context switch.", "For user-level code only, since the kernel can never use a busy-wait loop."], "a": [2], "e": "Spinlocks busy-wait: very fast for short waits (kernel-level, microseconds) but waste CPU if held long. Sleep locks block the thread, freeing the CPU, but cost a context switch on sleep and wake-up.", "l": 4, "t": "single"}, {"q": "Which scheduling metric is defined as finish time minus arrival time?", "o": ["Waiting time, where a lower value is better.", "Throughput, where a lower value is better.", "CPU utilisation, where a lower value is better.", "Turnaround time, where a lower value is better."], "a": [3], "e": "Turnaround = finish time - arrival time. Waiting time = time spent ready but not running. Response time = time until the first CPU time. Throughput and utilisation: higher is better.", "l": 4, "t": "single"}, {"q": "How do waiting time and response time differ?", "o": ["Waiting is the total time ready but not running; response is the time until first CPU.", "Waiting is the time until the first CPU; response is the total time ready but not running.", "Waiting is finish time minus arrival time; response is the burst time of the job.", "Waiting is the time spent in I/O queues; response is the time spent on the CPU."], "a": [0], "e": "Waiting time adds up every period a process sits in the ready queue. Response time only measures the delay before the first time it gets the CPU, which is crucial for interactive systems.", "l": 4, "t": "single"}, {"q": "What does the dispatcher do?", "o": ["It decides which jobs are admitted to the system and limits multiprogramming.", "It performs the context switch, switches to user mode and jumps to the process entry.", "It suspends processes and swaps them out to disk when the memory gets short.", "It calculates the next CPU burst length and sorts the ready queue by that value."], "a": [1], "e": "The short-term scheduler selects the next ready entity; the dispatcher gives it the CPU by context switching, moving to user mode and jumping to the right location in the program.", "l": 4, "t": "single"}, {"q": "FCFS: P1 (24 ms), P2 (3 ms), P3 (3 ms) arrive at time 0 in that order. What is the average waiting time?", "o": ["3 ms, because the waiting times are 0, 3 and 6 ms.", "27 ms, because the turnaround times are 24, 27 and 30 ms.", "17 ms, because the waiting times are 0, 24 and 27 ms.", "10 ms, because the three burst times add up to 30 ms in total."], "a": [2], "e": "FCFS order P1, P2, P3: waits are 0, 24, 27 = 51/3 = 17 ms. The same jobs in the order P2, P3, P1 (SJF) wait 0, 3, 6 = 3 ms on average.", "l": 4, "t": "single"}, {"q": "What is the convoy effect in FCFS scheduling?", "o": ["Long jobs queue up behind many short jobs, which inflates the average waiting time.", "All jobs share the CPU in equal slices, so the short jobs finish later than needed.", "Jobs with high priority keep arriving, so the low-priority jobs never get the CPU.", "Short jobs queue up behind one long job, which inflates the average waiting time."], "a": [3], "e": "FCFS is non-pre-emptive: if a long process (P1 = 24 ms) arrives first, short processes (P2, P3 = 3 ms) must wait for it. Like being stuck behind a slow truck on a single-lane road.", "l": 4, "t": "single"}, {"q": "What is the main property and main challenge of Shortest Job First (SJF)?", "o": ["It minimises average waiting time, but it needs to predict the CPU bursts.", "It minimises response time for all jobs, but it needs a quantum to be chosen.", "It guarantees that no job ever starves, but it needs an aging counter to work.", "It never needs a context switch, but it needs each job to have a fixed priority."], "a": [0], "e": "SJF (non-pre-emptive) gives the minimum average waiting time when burst times are known. Real systems must predict bursts, e.g. from historical averages.", "l": 4, "t": "single"}, {"q": "How does SRTF differ from SJF?", "o": ["SRTF is non-pre-emptive: the running job always finishes before any other starts.", "SRTF is pre-emptive: a newly arrived shorter job can interrupt the running one.", "SRTF picks the longest remaining job first, whereas SJF picks the shortest one.", "SRTF uses a fixed time quantum for each job, whereas SJF runs it to completion."], "a": [1], "e": "SJF is non-pre-emptive; SRTF (Shortest Remaining Time First) is its pre-emptive version, switching if a job with a shorter remaining time arrives.", "l": 4, "t": "single"}, {"q": "In priority scheduling, how does aging prevent starvation?", "o": ["It gradually lowers the priority of long jobs so that they stop using the CPU entirely.", "It gives every job the same priority once it has been in the queue for a while.", "It gradually raises the priority of waiting jobs so they are eventually served.", "It removes the jobs with low priority from the queue after a fixed time limit."], "a": [2], "e": "Pure priority scheduling can starve low-priority jobs if higher-priority work keeps arriving. Aging improves a job's priority as it waits, so all processes eventually execute.", "l": 4, "t": "single"}, {"q": "What is the trade-off in choosing the Round Robin quantum q?", "o": ["Too small behaves like FCFS; too large causes many context switches.", "Too small starves the long jobs; too large starves all of the short jobs.", "Too small removes pre-emption; too large removes the need for any queue.", "Too small causes many context switches; too large behaves like FCFS."], "a": [3], "e": "RR is pre-emptive and good for interactivity, but sensitive to q. Typical values are a few ms to tens of ms, tuned by the OS.", "l": 4, "t": "single"}, {"q": "How does a Multilevel Feedback Queue (MLFQ) treat jobs?", "o": ["Jobs move between queues by behaviour; short or I/O-bound jobs stay high, CPU-bound drift down.", "Jobs stay in one fixed queue by class; system jobs always run before the batch jobs.", "Jobs are ordered by arrival; the first job to arrive runs until it finishes or blocks.", "Jobs get equal slices in a circle; the slice grows each time the job is pre-empted."], "a": [0], "e": "MLFQ approximates SRTF without knowing burst lengths by learning from behaviour; aging brings starved jobs back up. A plain multilevel queue fixes jobs in a queue by class (system, interactive, batch).", "l": 4, "t": "single"}, {"q": "Which TWO are conditions needed for deadlock (as in the Dining Philosophers)?", "o": ["Free resource ordering.", "Pre-emption of resources.", "Unlimited resources.", "Mutual exclusion.", "Circular wait."], "a": [3, 4], "e": "The four deadlock conditions: mutual exclusion, hold-and-wait, no pre-emption, circular wait. Avoidance strategies break one of them.", "l": 4, "t": "multi"}, {"q": "In the Dining Philosophers problem, how does resource ordering prevent deadlock?", "o": ["Only four philosophers may sit at the table at once, which breaks mutual exclusion.", "Each philosopher picks the lower-numbered fork first, which breaks circular wait.", "Odd philosophers pick up the left fork first, which breaks hold-and-wait for all.", "Each philosopher takes both forks at once or none, which breaks the circular wait."], "a": [1], "e": "Ordering breaks circular wait. An arbitrator (only 4 may eat) and an asymmetric policy (odd left first, even right first) are other fixes. Trade-off: starvation may still occur if a philosopher is repeatedly unlucky.", "l": 4, "t": "single"}, {"q": "In the Readers-Writers problem, what is the risk of the readers-preferred variant?", "o": ["Readers can starve because a writer always holds the lock exclusively.", "Readers and writers deadlock because both hold a lock and wait on each other.", "Writers can starve because new readers keep arriving and sharing the data.", "Writers corrupt the data because they may write while the readers are reading."], "a": [2], "e": "Multiple readers may share, writers need exclusive access. Readers-preferred gives great read throughput but writers can starve; writers-preferred protects writers but readers can stall; a fair (FIFO) variant balances latency.", "l": 4, "t": "single"}, {"q": "What does the Sleeping Barber problem model?", "o": ["Circular wait: each barber holds one chair and waits for the next one to be free.", "Priority inversion: a low-priority customer holds the chair a high one needs.", "Mutual exclusion on one shared counter that every customer increments at once.", "Bounded buffers: limited waiting chairs, blocking, and wake-up signalling."], "a": [3], "e": "One barber and a limited number of chairs: the barber sleeps if no customers, an arriving customer wakes him, and if the shop is full the customer leaves. It relates to producer-consumer with a finite queue (e.g. thread pools).", "l": 4, "t": "single"}, {"q": "Which TWO are costs or risks of multithreading?", "o": ["Impossible to use multiple cores because all threads share one core.", "Slower response time because the UI thread blocks all of the workers.", "Race conditions and data corruption when there is no synchronisation.", "Higher memory use because each thread has its own private address space.", "Deadlocks, livelocks or starvation when locks are poorly designed."], "a": [2, 4], "e": "Costs: races and data corruption without synchronisation; deadlocks, livelocks and starvation with poor lock design; and Heisenbugs (timing-dependent bugs that can vanish when debugging).", "l": 4, "t": "multi"}]];
const quiz=document.getElementById('quiz'),totalEl=document.getElementById('total');
let Q=[],mode=0;
const L='abcdefgh';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function setMode(k){mode=k;[0,1,2].forEach(m=>document.getElementById('t'+m).classList.toggle('g',m!==k));
 Q=k===2?shuffle(DATA[0].concat(DATA[1])):DATA[k].slice();render()}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){quiz.innerHTML='';
 Q.forEach((it,i)=>{const d=el('section','q');d.dataset.i=i;
  const info=el('div','info');const b1=el('div');const bb=el('b','', 'Question ');bb.append(el('span','',String(i+1)));b1.append(bb);
  const st=el('div','st','Not yet answered');const mk=el('div','','Mark — out of 1.00');
  const tag=el('div');tag.append(el('span','tag','Lesson '+it.l));
  const fl=el('button','flag','⚑ Flag question');fl.setAttribute('aria-pressed','false');
  info.append(b1,st,mk,tag,fl);
  const body=el('div','body');body.append(el('p','',it.q));
  if(it.t==='multi')body.append(el('p','hint','Select all correct answers.'));
  it.o.forEach((t,j)=>{const lab=el('label','opt');const inp=document.createElement('input');inp.type=it.t==='multi'?'checkbox':'radio';inp.name='q'+i;inp.value=j;
   lab.append(inp,el('span','',L[j]+'. '+t));body.append(lab)});
  const ac=el('div','actions');const btn=el('button','b','Check');const fb=el('span','fb');ac.append(btn,fb);body.append(ac);
  const ex=el('div','exp');body.append(ex);
  btn.onclick=()=>check(i);d.append(info,body);quiz.append(d)});
 upd()}
const picked=d=>[...d.querySelectorAll('input')].map((x,j)=>x.checked?j:-1).filter(j=>j>=0);
function upd(){let n=0;[...quiz.children].forEach(d=>{const a=picked(d).length>0;if(a)n++;if(d.dataset.g===undefined)d.querySelector('.st').textContent=a?'Answer saved':'Not yet answered'});
 totalEl.textContent='Answered: '+n+' / '+Q.length}
function reveal(i,graded){const d=quiz.children[i],it=Q[i],fb=d.querySelector('.fb'),ex=d.querySelector('.exp');
 const ch=picked(d);const ok=ch.length===it.a.length&&ch.every(j=>it.a.includes(j));
 d.querySelectorAll('.opt').forEach((l,j)=>{l.classList.remove('ok','no','miss');l.classList.add('locked');l.querySelector('input').disabled=true;
  if(it.a.includes(j)){l.classList.add(ch.includes(j)?'ok':'miss')}else if(ch.includes(j))l.classList.add('no')});
 d.dataset.g=ok?1:0;d.querySelector('.st').textContent='Complete';
 fb.className='fb '+(ok?'ok':'no');
 fb.textContent=ok?'Correct — Mark 1.00 out of 1.00':(ch.length?'Incorrect — Mark 0.00 out of 1.00':'Not answered — Mark 0.00 out of 1.00');
 ex.textContent='Why: '+it.e;ex.classList.add('show')}
function check(i){const d=quiz.children[i];if(d.dataset.g!==undefined)return;
 if(!picked(d).length){const fb=d.querySelector('.fb');fb.className='fb no';fb.textContent='Please answer first.';return}
 reveal(i);upd();score(false)}
function score(final){const gs=[...quiz.children].filter(d=>d.dataset.g!==undefined);const s=gs.filter(d=>d.dataset.g==='1').length;
 if(final)totalEl.textContent='Final score: '+s+' / '+Q.length+' ('+Math.round(s/Q.length*100)+'%)';
 else totalEl.textContent='Answered: '+[...quiz.children].filter(d=>picked(d).length>0).length+' / '+Q.length+(gs.length?'  ·  Correct so far: '+s+' / '+gs.length:'')}
document.getElementById('finish').onclick=()=>{[...quiz.children].forEach((d,i)=>{if(d.dataset.g===undefined)reveal(i)});score(true)};
document.getElementById('reset').onclick=()=>setMode(mode);
quiz.addEventListener('change',upd);
quiz.addEventListener('click',e=>{const f=e.target.closest('.flag');if(f){const on=f.getAttribute('aria-pressed')!=='true';f.setAttribute('aria-pressed',on);f.textContent=(on?'⚑ Unflag':'⚑ Flag')+' question'}});
[0,1,2].forEach(m=>document.getElementById('t'+m).onclick=()=>setMode(m));
setMode(0);
</script>
